<title>War Room</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Sleeper is a dark-only app, so this page commits to one visual world
     rather than offering a light theme. Every colour is painted explicitly so
     the page holds on whatever ground the viewer's host paints behind it. */
  :root {
    color-scheme: dark;

    --bg:        #0E1116;
    --raise:     #161B22;
    --raise-2:   #1C232C;
    --sunk:      #0A0D11;
    --line:      #232C37;
    --line-soft: #1A222B;

    --ink:       #F2F5F8;
    --ink-2:     #9AA7B6;
    --ink-3:     #6A7787;

    /* Sleeper's position colours — the most recognisable thing about the app.
       They are identity, not severity: a colour says "running back", never
       "bad". Severity is the diverging pair below. */
    --qb:  #FF2A6D;
    --rb:  #00CEB8;
    --wr:  #58A7FF;
    --te:  #FFAE58;
    --k:   #BD66FF;
    --def: #7D8797;

    /* Polarity: above or below the league. Kept apart from position colour. */
    --cool: #2E9CBC;
    --warm: #D4703C;
    --good: #2BD98C;
    --bad:  #FF5C5C;

    --shadow: 0 1px 2px rgb(0 0 0 / .5), 0 12px 32px -16px rgb(0 0 0 / .8);
    --sans: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --r: 14px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 72px; }
  header .wrap { padding-block: 0; }

  h1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--wr); outline-offset: 2px; border-radius: 8px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- top chrome ---------- */
  header { background: var(--sunk); border-bottom: 1px solid var(--line-soft); position: sticky; top: 0; z-index: 10; }
  .masthead { display: flex; align-items: center; gap: 12px; padding-block: 13px 11px; flex-wrap: wrap; }
  .mark {
    width: 32px; height: 32px; border-radius: 10px; flex: none; display: grid; place-items: center;
    background: linear-gradient(160deg, var(--rb), #009E8D); color: #052; font-weight: 800; font-size: 15px;
  }
  .masthead h1 { font-size: 18px; }
  .masthead .who { color: var(--ink-3); font-size: 13px; font-weight: 600; }
  .masthead .stamp { margin-left: auto; text-align: right; color: var(--ink-3); font-size: 11.5px; font-weight: 600; line-height: 1.35; }

  .pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
  .pills::-webkit-scrollbar { display: none; }
  .pill {
    border: 1px solid var(--line); background: var(--raise); color: var(--ink-2);
    border-radius: 999px; padding: 7px 15px; font-size: 13px; font-weight: 700; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .pill:hover { color: var(--ink); border-color: #32404F; }
  .pill[aria-selected="true"] { background: var(--ink); color: #0B0E12; border-color: var(--ink); }
  .pill .rank { font-family: var(--mono); font-size: 11px; opacity: .7; font-weight: 500; }

  .tabs { display: flex; gap: 6px; padding: 16px 0 4px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    border: 0; background: transparent; color: var(--ink-3); border-radius: 10px;
    padding: 8px 14px; font-size: 14px; font-weight: 700; white-space: nowrap;
  }
  .tab:hover { color: var(--ink); background: var(--raise); }
  .tab[aria-selected="true"] { color: var(--ink); background: var(--raise-2); }
  .tab .count {
    font-family: var(--mono); font-size: 11px; margin-left: 6px; padding: 1px 6px;
    border-radius: 999px; background: var(--rb); color: #042; font-weight: 600;
  }

  section.view[hidden] { display: none; }

  /* ---------- headline facts ---------- */
  .facts { display: flex; flex-wrap: wrap; gap: 12px; padding: 18px 0 4px; }
  .fact { flex: 1 1 150px; background: var(--raise); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 13px 15px; }
  .fact .eyebrow { display: block; margin-bottom: 5px; }
  .fact .v { font-size: 25px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
  .fact .v small { font-size: 13px; color: var(--ink-3); font-weight: 700; letter-spacing: 0; }

  .split { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; padding-top: 16px; align-items: start; }
  @media (max-width: 860px) { .split { grid-template-columns: minmax(0, 1fr); } }

  .panel { background: var(--raise); border: 1px solid var(--line-soft); border-radius: var(--r); overflow: hidden; }
  .panel + .panel { margin-top: 14px; }
  .panel > h2 { font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3);
                padding: 14px 15px 10px; }
  .panel .body { padding: 0 15px 14px; }
  .note { color: var(--ink-3); font-size: 12.5px; font-weight: 600; margin: 8px 0 0; line-height: 1.5; }

  /* ---------- player rows, Sleeper-style ---------- */
  .prow { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
  .prow:last-child { border-bottom: 0; }
  .slot {
    flex: none; width: 42px; font-family: var(--mono); font-size: 11px; font-weight: 600;
    color: var(--ink-3); letter-spacing: .04em;
  }
  .av {
    flex: none; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
    font-size: 12px; font-weight: 800; letter-spacing: -.02em; color: #0B0E12;
  }
  .av.empty { background: var(--raise-2); color: var(--ink-3); border: 1px dashed var(--line); }
  .pmain { flex: 1; min-width: 0; }
  .pname { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pmeta { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 11.5px; font-weight: 700; color: var(--ink-3); }
  .pos {
    font-size: 10px; font-weight: 800; letter-spacing: .04em; padding: 1px 5px; border-radius: 4px; color: #0B0E12;
  }
  .ppts { flex: none; font-family: var(--mono); font-size: 14px; font-weight: 600; text-align: right; min-width: 46px; }
  .tagline { font-size: 10px; font-weight: 800; letter-spacing: .04em; padding: 1px 5px; border-radius: 4px; border: 1px solid; }
  .tagline.hurt { color: var(--bad); border-color: color-mix(in oklab, var(--bad) 45%, transparent); }
  .tagline.nodata { color: var(--ink-3); border-color: var(--line); }
  .tagline.starts { color: var(--good); border-color: color-mix(in oklab, var(--good) 45%, transparent); }
  .prow.dim .pname, .prow.dim .ppts { color: var(--ink-2); }
  .prow.gap .pname { color: var(--warm); font-style: italic; font-weight: 600; }

  /* ---------- diverging strength bars ---------- */
  .bars { display: grid; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 30px 1fr 46px; align-items: center; gap: 10px; }
  .track { position: relative; height: 16px; background: var(--sunk); border-radius: 4px; }
  .track::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--line); }
  .track i { position: absolute; top: 3px; bottom: 3px; border-radius: 2px; }
  .bar-row .z { font-family: var(--mono); font-size: 12px; font-weight: 500; text-align: right; }

  .ranked { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
  .ranked li { display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 600; }
  .ranked .why { color: var(--ink-3); font-size: 12.5px; }

  /* ---------- heatmap ---------- */
  .heat-scroll { overflow-x: auto; }
  .heat { border-collapse: separate; border-spacing: 3px; font-size: 13px; min-width: 560px; }
  .heat th { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
             color: var(--ink-3); padding: 0 6px 6px; text-align: center; }
  .heat th.team-h { text-align: left; }
  .heat td.team { font-weight: 700; font-size: 13.5px; white-space: nowrap; padding-right: 10px;
                  max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .heat td.team.me { color: var(--rb); }
  .heat .cell { width: 58px; text-align: center; font-family: var(--mono); font-size: 12.5px; font-weight: 500;
                padding: 8px 4px; border-radius: 8px; color: var(--ink); cursor: default; }
  .heat .cell.hole { outline: 1.5px solid var(--warm); outline-offset: -1.5px; font-weight: 600; }
  .heat .total { width: 150px; padding-left: 10px; }
  .heat .tbar { height: 7px; background: var(--sunk); border-radius: 4px; position: relative; margin-bottom: 3px; }
  .heat .tbar i { position: absolute; inset: 0 auto 0 0; background: var(--ink-3); border-radius: 4px; }
  .heat .tbar i.me { background: var(--rb); }
  .heat .total span { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .scale { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 12px; font-weight: 600; color: var(--ink-3); flex-wrap: wrap; }
  .scale .ramp { display: flex; height: 9px; border-radius: 3px; overflow: hidden; width: 170px; }
  .scale .ramp i { flex: 1; }

  /* ---------- trade cards ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; padding: 16px 0 2px; }
  .seg { display: inline-flex; background: var(--raise); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: transparent; color: var(--ink-3); border-radius: 8px; padding: 7px 13px; font-size: 13px; font-weight: 700; }
  .seg button[aria-pressed="true"] { background: var(--raise-2); color: var(--ink); }
  .ghost {
    border: 1px solid var(--line); background: var(--raise); color: var(--ink); border-radius: 11px;
    padding: 8px 15px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px;
  }
  .ghost:hover { border-color: #32404F; background: var(--raise-2); }
  .ghost:disabled { opacity: .45; cursor: default; }
  select {
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--raise);
    border: 1px solid var(--line); border-radius: 11px; padding: 8px 11px; max-width: 100%;
  }

  .offer { background: var(--raise); border: 1px solid var(--line-soft); border-radius: var(--r); margin-top: 12px; box-shadow: var(--shadow); }
  .offer.is-saved { border-color: color-mix(in oklab, var(--good) 40%, var(--line-soft)); }
  .offer > summary { list-style: none; cursor: pointer; padding: 13px 14px; display: flex; gap: 12px; align-items: flex-start; }
  .offer > summary::-webkit-details-marker { display: none; }
  .offer[open] > summary { border-bottom: 1px solid var(--line-soft); }
  .offer .head { flex: 1; min-width: 0; }
  .offer .partner { font-size: 14.5px; font-weight: 800; }
  .offer .partner span { color: var(--ink-3); font-weight: 700; font-size: 12.5px; }
  /* Deliberately not a flex row: as inline text the line wraps like a
     sentence, instead of stranding the arrow alone on a line of its own. */
  .offer .swap { margin-top: 4px; font-size: 13px; font-weight: 600; }
  .offer .swap .out { color: var(--ink-3); }
  .offer .swap .in { color: var(--ink); font-weight: 700; }
  .offer .swap .arrow { color: var(--rb); font-weight: 800; padding: 0 5px; }

  /* At phone width the summary stacks, with the numbers and the two controls
     sharing one row rather than each wrapping onto its own. */
  @media (max-width: 560px) {
    .offer > summary { flex-wrap: wrap; }
    .offer .head { flex: 1 1 100%; }
    .gains { flex: 1; }
    .acts { margin-left: auto; }
  }

  .gains { display: flex; gap: 14px; align-items: baseline; white-space: nowrap; flex: none; }
  .gains .g { text-align: right; }
  .gains .g b { font-family: var(--mono); font-size: 18px; font-weight: 600; display: block; letter-spacing: -.02em; }
  .gains .mine b { color: var(--good); }
  .gains .g .eyebrow { font-size: 9.5px; }

  /* dismiss / save — deliberately outside the summary's click target */
  .acts { display: flex; gap: 6px; flex: none; align-self: center; }
  .act {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--raise-2); color: var(--ink-3); display: grid; place-items: center; padding: 0;
  }
  .act:hover { color: var(--ink); border-color: #3A4757; }
  .act.keep:hover { color: var(--good); border-color: color-mix(in oklab, var(--good) 50%, transparent); }
  .act.drop:hover { color: var(--bad); border-color: color-mix(in oklab, var(--bad) 50%, transparent); }
  .act.on { color: var(--good); border-color: color-mix(in oklab, var(--good) 55%, transparent); background: color-mix(in oklab, var(--good) 14%, var(--raise-2)); }
  .act svg { width: 16px; height: 16px; }

  .legs { display: grid; grid-template-columns: 1fr 1fr; }
  @media (max-width: 640px) { .legs { grid-template-columns: 1fr; } }
  .leg { padding: 12px 14px; }
  .leg + .leg { border-left: 1px solid var(--line-soft); }
  @media (max-width: 640px) { .leg + .leg { border-left: 0; border-top: 1px solid var(--line-soft); } }
  .leg > .eyebrow { display: block; margin-bottom: 6px; }

  .ledger { padding: 11px 14px 14px; border-top: 1px solid var(--line-soft); }
  .ledger .row { display: flex; gap: 9px; align-items: baseline; font-size: 13px; font-weight: 600; padding: 3px 0; }
  .ledger .row .slotname { font-family: var(--mono); font-size: 11px; color: var(--ink-3); width: 52px; flex: none; }
  .ledger .row .d { font-family: var(--mono); font-variant-numeric: tabular-nums; margin-left: auto; flex: none; }
  .up { color: var(--good); } .down { color: var(--bad); }
  .caution { display: block; margin-top: 10px; padding: 9px 11px; border-radius: 10px; font-size: 12.5px; font-weight: 600; line-height: 1.5;
             background: color-mix(in oklab, var(--warm) 12%, transparent); color: #F0A87A;
             border: 1px solid color-mix(in oklab, var(--warm) 30%, transparent); }

  .blank { padding: 36px 4px; color: var(--ink-2); max-width: 60ch; }
  .blank h3 { font-size: 17px; color: var(--ink); margin-bottom: 7px; }
  .blank p { margin: 0 0 8px; font-size: 14px; font-weight: 600; line-height: 1.55; }

  #tip {
    position: fixed; z-index: 40; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--raise-2); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
    padding: 8px 10px; font-size: 12.5px; font-weight: 600; max-width: 240px; line-height: 1.45;
  }
  #toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(12px); z-index: 50;
    background: var(--ink); color: #0B0E12; border-radius: 999px; padding: 9px 18px;
    font-size: 13px; font-weight: 800; opacity: 0; transition: opacity .16s, transform .16s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer { margin-top: 34px; padding-top: 15px; border-top: 1px solid var(--line-soft); color: var(--ink-3); font-size: 12px; font-weight: 600; max-width: 74ch; line-height: 1.6; }
  footer p { margin: 0 0 7px; }
  footer b { color: var(--ink-2); }
</style>

<header>
  <div class="wrap">
    <div class="masthead">
      <span class="mark">W</span>
      <h1>War Room</h1>
      <span class="who" id="who"></span>
      <span class="stamp" id="stamp"></span>
    </div>
    <nav class="pills" id="leagues" role="tablist" aria-label="Leagues"></nav>
  </div>
</header>

<div class="wrap">
  <nav class="tabs" id="tabs" role="tablist" aria-label="Views">
    <button class="tab" id="tab-team" role="tab" aria-selected="true" aria-controls="view-team">My Team</button>
    <button class="tab" id="tab-league" role="tab" aria-selected="false" aria-controls="view-league">League</button>
    <button class="tab" id="tab-trades" role="tab" aria-selected="false" aria-controls="view-trades">Trade Finder</button>
    <button class="tab" id="tab-saved" role="tab" aria-selected="false" aria-controls="view-saved">Saved</button>
  </nav>

  <main>
    <section class="view" id="view-team" role="tabpanel" aria-labelledby="tab-team"></section>
    <section class="view" id="view-league" role="tabpanel" aria-labelledby="tab-league" hidden></section>
    <section class="view" id="view-trades" role="tabpanel" aria-labelledby="tab-trades" hidden></section>
    <section class="view" id="view-saved" role="tabpanel" aria-labelledby="tab-saved" hidden></section>
  </main>

  <footer id="footnote"></footer>
</div>

<div id="tip" role="status"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// ===== src/model/schema.js =====
/**
 * Unified internal data model that every platform integration (Sleeper, ESPN,
 * Yahoo, ...) normalizes into. The dashboard UI and projection logic only
 * ever deal with these shapes, never with a platform's raw response.
 *
 * @typedef {'sleeper'|'espn'|'yahoo'} Platform
 *
 * @typedef {Object} League
 * @property {string} id              `${platform}:${externalId}`
 * @property {Platform} platform
 * @property {string} externalId      platform's own league id
 * @property {string} name
 * @property {string} season          e.g. "2025"
 * @property {string} scoringType     'ppr' | 'half_ppr' | 'standard' | 'custom'
 * @property {number} totalRosters
 * @property {string[]} rosterPositions  e.g. ['QB','RB','RB','WR','WR','TE','FLEX','DEF','K','BN','BN','BN','BN','BN','BN']
 * @property {string} status          'pre_draft' | 'drafting' | 'in_season' | 'complete'
 *
 * @typedef {Object} Team
 * @property {string} id              `${leagueId}:${externalId}`
 * @property {string} leagueId
 * @property {string} externalId      platform's own roster/team id
 * @property {string|null} ownerId    platform's own user id for the owner; this is
 *                                    what resolves "which of these teams is mine",
 *                                    per league — the same person can own a
 *                                    different roster in every league they're in
 * @property {string} ownerName
 * @property {string} teamName
 * @property {number} wins
 * @property {number} losses
 * @property {number} ties
 * @property {number} pointsFor
 * @property {number} pointsAgainst
 *
 * @typedef {Object} Player
 * @property {string} id              canonical id, Sleeper's player id preferred
 * @property {Object} platformIds     { sleeper?, espn?, yahoo? }
 * @property {string} fullName
 * @property {string} position        'QB'|'RB'|'WR'|'TE'|'K'|'DEF'
 * @property {string|null} nflTeam    NFL team abbreviation, null if free agent/retired
 * @property {string} status          'Active'|'Injured Reserve'|'Out'|'Questionable'|...
 * @property {number|null} age
 * @property {number|null} yearsExp
 *
 * @typedef {Object} RosterSlot
 * @property {string} leagueId
 * @property {string} teamId
 * @property {string} playerId
 * @property {'starter'|'bench'|'ir'|'taxi'} slot
 *
 * @typedef {Object} Projection
 * @property {string} playerId
 * @property {string} leagueId        projections can be scoring-type dependent
 * @property {string} season
 * @property {number} week
 * @property {number} projectedPoints
 * @property {string|null} opponent   NFL team abbreviation, null on bye
 * @property {boolean} bye
 * @property {'custom'|'fantasypros'|'nflverse'} source
 *
 * @typedef {Object} Ranking
 * @property {string} playerId
 * @property {string} position
 * @property {number} rank            rank within position
 * @property {number|null} tier
 * @property {string} source
 * @property {string} asOf            ISO date
 */

/** @param {Platform} platform @param {string} externalId */
function leagueId(platform, externalId) {
  return `${platform}:${externalId}`;
}

/** @param {string} leagueId @param {string} externalId */
function teamId(leagueId, externalId) {
  return `${leagueId}:${externalId}`;
}

const ROSTER_SLOT = /** @type {const} */ ({
  STARTER: 'starter',
  BENCH: 'bench',
  IR: 'ir',
  TAXI: 'taxi',
});

const POSITIONS = /** @type {const} */ (['QB', 'RB', 'WR', 'TE', 'K', 'DEF']);

// ===== src/analysis/lineup.js =====
/**
 * Optimal starting lineup.
 *
 * A roster's value is the best lineup it can legally field — not the sum of
 * its players, and not whatever is currently flagged `starter`. That flag is
 * stale, may be illegal, and records no lineup position at all, so the
 * assignment is always re-derived here from position eligibility.
 */

const BENCH_SLOTS = new Set(['BN', 'BE', 'IR', 'TAXI']);

/** Which player positions may fill each roster slot. */
const SLOT_ELIGIBILITY = {
  QB: ['QB'],
  RB: ['RB'],
  WR: ['WR'],
  TE: ['TE'],
  K: ['K'],
  DEF: ['DEF'],
  DST: ['DEF'],
  FLEX: ['RB', 'WR', 'TE'],
  WRRB_FLEX: ['RB', 'WR'],
  WRRB_WRT: ['RB', 'WR', 'TE'],
  REC_FLEX: ['WR', 'TE'],
  SUPER_FLEX: ['QB', 'RB', 'WR', 'TE'],
};

/** Cost for an assignment that is not allowed. Large but finite — an
 * infinite sentinel poisons the algorithm's potentials into NaN. */
const INELIGIBLE = 1e9;

/**
 * Eligibility as bitmasks. The trade search re-solves lineups tens of
 * thousands of times, so this inner test has to be a bit-and rather than an
 * array scan.
 */
/**
 * One bit per position, so eligibility is an integer AND rather than a set
 * walk. Exported because the trade search gates candidate packages with the
 * same masks: a second copy that drifted would let the search accept packages
 * the lineup solver then refuses to start.
 */
const POSITION_BIT = { QB: 1, RB: 2, WR: 4, TE: 8, K: 16, DEF: 32 };
const SLOT_MASK = {};
for (const slot of Object.keys(SLOT_ELIGIBILITY)) {
  SLOT_MASK[slot] = SLOT_ELIGIBILITY[slot].reduce((mask, p) => mask | (POSITION_BIT[p] || 0), 0);
}
function maskForSlot(slot) {
  const known = SLOT_MASK[slot];
  return known === undefined ? POSITION_BIT[slot] || 0 : known;
}
function bitForPosition(position) {
  return POSITION_BIT[position] || 0;
}

function isScoringSlot(slot) {
  return !BENCH_SLOTS.has(slot);
}

function eligiblePositions(slot) {
  return SLOT_ELIGIBILITY[slot] || [slot];
}

function canFill(slot, position) {
  return eligiblePositions(slot).indexOf(position) !== -1;
}

/** Slots a roster must fill, bench excluded. */
function scoringSlots(rosterPositions) {
  return (rosterPositions || []).filter(isScoringSlot);
}

/**
 * Deterministic player ordering. Ties in projected value would otherwise let
 * the matching flip between runs, which makes lineup deltas jitter and
 * manufactures trades that are really just rounding noise.
 *
 * Values are read once per player here rather than repeatedly inside a
 * comparator — this runs in the innermost loop of the trade search.
 */
function prepare(players, valueFor) {
  const n = players.length;
  const values = new Array(n);
  const order = new Array(n);
  for (let i = 0; i < n; i++) {
    values[i] = valueFor(players[i]) || 0;
    order[i] = i;
  }
  order.sort((a, b) => {
    const dv = values[b] - values[a];
    if (dv !== 0) return dv;
    const pa = players[a];
    const pb = players[b];
    if (pa.position !== pb.position) return pa.position < pb.position ? -1 : 1;
    return String(pa.id) < String(pb.id) ? -1 : 1;
  });
  const pool = new Array(n);
  const sorted = new Array(n);
  const bits = new Array(n);
  for (let i = 0; i < n; i++) {
    const idx = order[i];
    pool[i] = players[idx];
    sorted[i] = values[idx];
    bits[i] = bitForPosition(players[idx].position);
  }
  return { pool, values: sorted, bits };
}

/** Scratch buffers reused across solves; the solver is synchronous and non-reentrant. */
const scratch = { u: [], v: [], p: [], way: [], minv: [], used: [], rowToCol: [], cost: [] };
function buffer(name, size) {
  const existing = scratch[name];
  if (existing.length < size) scratch[name] = new Array(size);
  return scratch[name];
}

/**
 * Rectangular max-weight assignment via the Jonker-Volgenant shortest
 * augmenting path method (minimises cost; we feed it negated values).
 * Slots become rows, players columns, padded with zero-value dummies so a
 * slot nobody can fill simply comes back empty.
 *
 * O(rows^2 * cols) — at most 10 slots x ~20 players.
 *
 * Writes into shared scratch buffers; the returned rowToCol is only valid
 * until the next call.
 */
function solveAssignment(values, bits, slots) {
  const nRows = slots.length;
  const nPlayers = values.length;
  const nCols = Math.max(nPlayers, nRows);
  const cost = buffer('cost', nRows * nCols);

  for (let i = 0; i < nRows; i++) {
    const mask = maskForSlot(slots[i]);
    const base = i * nCols;
    for (let j = 0; j < nCols; j++) {
      if (j >= nPlayers) cost[base + j] = 0;
      else cost[base + j] = mask & bits[j] ? -values[j] : INELIGIBLE;
    }
  }

  const u = buffer('u', nRows + 1);
  const v = buffer('v', nCols + 1);
  const p = buffer('p', nCols + 1);
  const way = buffer('way', nCols + 1);
  const minv = buffer('minv', nCols + 1);
  const used = buffer('used', nCols + 1);

  for (let i = 0; i <= nRows; i++) u[i] = 0;
  for (let j = 0; j <= nCols; j++) {
    v[j] = 0;
    p[j] = 0;
    way[j] = 0;
  }

  for (let i = 1; i <= nRows; i++) {
    p[0] = i;
    let j0 = 0;
    for (let j = 0; j <= nCols; j++) {
      minv[j] = Infinity;
      used[j] = false;
    }
    do {
      used[j0] = true;
      const i0 = p[j0];
      const rowBase = (i0 - 1) * nCols;
      const ui = u[i0];
      let delta = Infinity;
      let j1 = 0;
      for (let j = 1; j <= nCols; j++) {
        if (used[j]) continue;
        const cur = cost[rowBase + j - 1] - ui - v[j];
        if (cur < minv[j]) {
          minv[j] = cur;
          way[j] = j0;
        }
        if (minv[j] < delta) {
          delta = minv[j];
          j1 = j;
        }
      }
      for (let j = 0; j <= nCols; j++) {
        if (used[j]) {
          u[p[j]] += delta;
          v[j] -= delta;
        } else {
          minv[j] -= delta;
        }
      }
      j0 = j1;
    } while (p[j0] !== 0);
    do {
      const j1 = way[j0];
      p[j0] = p[j1];
      j0 = j1;
    } while (j0);
  }

  const rowToCol = buffer('rowToCol', nRows);
  for (let i = 0; i < nRows; i++) rowToCol[i] = -1;
  for (let j = 1; j <= nCols; j++) {
    if (p[j] > 0 && p[j] <= nRows) rowToCol[p[j] - 1] = j - 1;
  }
  return rowToCol;
}

/**
 * @param {Array<{id: string, position: string}>} players  available players (exclude IR/taxi)
 * @param {string[]} rosterPositions  league slot template, e.g. ['QB','RB','RB','WR','WR','TE','FLEX','K','DEF','BN']
 * @param {(player) => number} valueFor
 * @returns {{total: number, assignments: Array, unfilled: Array, benched: string[]}}
 */
function optimalLineup(players, rosterPositions, valueFor) {
  const slots = scoringSlots(rosterPositions);
  const { pool, values, bits } = prepare(players || [], valueFor);

  if (slots.length === 0) {
    return { total: 0, assignments: [], unfilled: [], benched: pool.map((p) => p.id) };
  }

  const rowToCol = solveAssignment(values, bits, slots);

  const assignments = [];
  const unfilled = [];
  const taken = new Set();
  let total = 0;

  for (let i = 0; i < slots.length; i++) {
    const col = rowToCol[i];
    const player = col >= 0 && col < pool.length ? pool[col] : null;
    if (!player || !(maskForSlot(slots[i]) & bits[col])) {
      unfilled.push({ slot: slots[i], slotIndex: i });
      continue;
    }
    total += values[col];
    taken.add(player.id);
    assignments.push({
      slot: slots[i],
      slotIndex: i,
      playerId: player.id,
      position: player.position,
      value: values[col],
    });
  }

  return {
    total,
    assignments,
    unfilled,
    benched: pool.filter((p) => !taken.has(p.id)).map((p) => p.id),
  };
}

/**
 * Just the number. The trade search calls this tens of thousands of times, so
 * it skips building the assignment objects entirely.
 */
function lineupTotal(players, rosterPositions, valueFor) {
  const slots = scoringSlots(rosterPositions);
  if (slots.length === 0) return 0;
  const { values, bits } = prepare(players || [], valueFor);
  const rowToCol = solveAssignment(values, bits, slots);
  let total = 0;
  for (let i = 0; i < slots.length; i++) {
    const col = rowToCol[i];
    if (col >= 0 && col < values.length && maskForSlot(slots[i]) & bits[col]) total += values[col];
  }
  return total;
}

/**
 * Fill each slot in order with the best remaining eligible player.
 *
 * Exported only as a test oracle: this is optimal when eligibility sets are
 * nested (QB inside SUPER_FLEX) but wrong in general — a FLEX listed before
 * a dedicated TE will eat the only tight end and strand the TE slot.
 */
function greedyLineup(players, rosterPositions, valueFor) {
  const slots = scoringSlots(rosterPositions);
  const { pool, values } = prepare(players || [], valueFor);
  const used = new Set();
  let total = 0;
  for (const slot of slots) {
    for (let i = 0; i < pool.length; i++) {
      if (used.has(pool[i].id) || !canFill(slot, pool[i].position)) continue;
      used.add(pool[i].id);
      total += values[i];
      break;
    }
  }
  return total;
}

// ===== src/analysis/value.js =====
/**
 * Turning a one-week projection into something you can trade on.
 *
 * Two distinct notions of value live here, and conflating them is the classic
 * way to build a trade tool nobody trusts:
 *
 *   VOR      — value over replacement. Scarcity-aware but team-independent.
 *              Used for pruning and tie-breaks ONLY.
 *   marginal — what a player actually adds to (or costs) one specific roster's
 *              optimal lineup. Zero for anyone who doesn't crack it.
 *
 * Trades are mutually positive exactly when each side ships a player whose
 * marginal cost at home is far below his marginal value away.
 */


const DEFAULT_FANTASY_END_WEEK = 17;

/** Weeks of fantasy value left, including the current one. */
function remainingWeeks(currentWeek, endWeek = DEFAULT_FANTASY_END_WEEK) {
  return Math.max(1, endWeek - (Number(currentWeek) || 1) + 1);
}

/** Fraction of the remaining season we expect this player to be available. */
function availabilityFactor(status, weeks) {
  if (!status || /^active$/i.test(status)) return 1;
  if (/injured reserve|^ir$/i.test(status)) return 0;
  if (/questionable/i.test(status)) return 0.92;
  if (/doubtful/i.test(status)) return 0.6;
  if (/^out/i.test(status)) return weeks > 0 ? Math.max(0, (weeks - 1) / weeks) : 0;
  return 1;
}

function median(values) {
  if (!values.length) return null;
  const sorted = values.slice().sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

/**
 * Rest-of-season value per player.
 *
 * HONESTY NOTE: `weeks` is a constant multiplier, so it changes no ordering.
 * The real content of this function is bye-week imputation and availability
 * discounting; the multiplier only puts deltas in readable season units.
 * It does NOT model future bye weeks (we only know the current week's flag),
 * schedule strength, injury-return timing, usage trend, or playoff matchups.
 *
 * Bye handling is the highest-severity correctness issue in the whole engine:
 * a projection row on a bye carries projectedPoints 0, so used raw, every
 * star on bye looks worthless and the engine screams "sell". We impute from
 * the nearest-ranked player at the same position who is not on a bye.
 *
 * @returns {Map<string, {ros: number|null, base: number|null, quality: string, availability: number}>}
 */
function restOfSeasonValues(players, { projectionFor, rankingFor, weeks }) {
  const observed = new Map(); // position -> [{rank, base}]
  const bases = new Map();    // position -> [base]

  for (const player of players) {
    const projection = projectionFor(player);
    if (!projection || typeof projection.projectedPoints !== 'number' || projection.bye) continue;
    const base = projection.projectedPoints;
    if (!bases.has(player.position)) bases.set(player.position, []);
    bases.get(player.position).push(base);
    const ranking = rankingFor ? rankingFor(player) : null;
    if (ranking && typeof ranking.rank === 'number') {
      if (!observed.has(player.position)) observed.set(player.position, []);
      observed.get(player.position).push({ rank: ranking.rank, base });
    }
  }
  for (const list of observed.values()) list.sort((a, b) => a.rank - b.rank);

  function impute(player) {
    const ranking = rankingFor ? rankingFor(player) : null;
    const peers = observed.get(player.position);
    if (ranking && typeof ranking.rank === 'number' && peers && peers.length) {
      let best = peers[0];
      let bestGap = Math.abs(peers[0].rank - ranking.rank);
      for (const peer of peers) {
        const gap = Math.abs(peer.rank - ranking.rank);
        if (gap < bestGap) { bestGap = gap; best = peer; }
      }
      return best.base;
    }
    return median(bases.get(player.position) || []);
  }

  const out = new Map();
  for (const player of players) {
    const projection = projectionFor(player);
    const availability = availabilityFactor(player.status, weeks);
    let base = null;
    let quality = 'missing';

    if (projection && typeof projection.projectedPoints === 'number') {
      if (projection.bye) {
        base = impute(player);
        quality = base === null ? 'missing' : 'bye-imputed';
      } else {
        base = projection.projectedPoints;
        quality = 'observed';
      }
    }

    out.set(player.id, {
      base,
      quality,
      availability,
      ros: base === null ? null : base * weeks * availability,
    });
  }
  return out;
}

/**
 * How many players at each position the league collectively needs to start,
 * apportioning each FLEX slot evenly across the positions it accepts.
 */
function positionalDemand(league) {
  const slots = (league.rosterPositions || []).filter(isScoringSlot);
  const demand = {};
  for (const slot of slots) {
    const eligible = eligiblePositions(slot);
    const share = 1 / eligible.length;
    for (const position of eligible) {
      demand[position] = (demand[position] || 0) + share;
    }
  }
  const teams = league.totalRosters || 1;
  for (const position of Object.keys(demand)) demand[position] *= teams;
  return demand;
}

/**
 * Replacement level per position — what you could get for free.
 *
 * The waiver pool is ground truth: if free RBs are worth 8, then 8 is what an
 * RB costs you. The demand-rank estimator (the Nth best player leaguewide,
 * where N is how many the league must start) is only a FALLBACK for positions
 * whose waiver pool is empty — common at QB and TE in deep leagues, where the
 * observed estimator has nothing to say.
 *
 * Taking the higher of the two would be a bug: demand-rank routinely names a
 * player who is rostered and therefore not available at any price, which
 * inflates replacement level and erases exactly the surplus that makes trades
 * possible.
 *
 * We take the MEDIAN of the top few free agents rather than the single best.
 * Only one team can claim the best one; everyone else gets the next tier, so
 * the maximum overstates what is realistically available. It is also fragile:
 * one lucky waiver player would otherwise wipe out the tradeable value of
 * every player at that position.
 */
function replacementLevels({ league, allPlayers, available, rosFor }) {
  const demand = positionalDemand(league);
  const positions = new Set([...Object.keys(demand), ...allPlayers.map((p) => p.position)]);
  const sampleSize = Math.max(3, Math.ceil((league.totalRosters || 1) / 3));
  const levels = {};

  for (const position of positions) {
    const waiver = available
      .filter((p) => p.position === position)
      .map((p) => rosFor(p))
      .filter((v) => typeof v === 'number')
      .sort((a, b) => b - a);

    if (waiver.length) {
      levels[position] = median(waiver.slice(0, sampleSize));
      continue;
    }

    const need = Math.max(1, Math.round(demand[position] || 0));
    const pool = allPlayers
      .filter((p) => p.position === position)
      .map((p) => rosFor(p))
      .filter((v) => typeof v === 'number')
      .sort((a, b) => b - a);
    levels[position] = pool.length ? pool[Math.min(need, pool.length) - 1] : 0;
  }
  return levels;
}

/** Value over replacement — abstract, team-independent. Pruning and tie-breaks only. */
function valueOverReplacement(player, rosFor, levels) {
  const ros = rosFor(player);
  if (typeof ros !== 'number') return null;
  return ros - (levels[player.position] || 0);
}

/** What losing this player costs the roster, net of whoever replaces him. */
function marginalOut(activePlayers, playerId, rosterPositions, valueFor) {
  const before = optimalLineup(activePlayers, rosterPositions, valueFor).total;
  const after = optimalLineup(
    activePlayers.filter((p) => p.id !== playerId),
    rosterPositions,
    valueFor
  ).total;
  return before - after;
}

/** What gaining this player adds to the roster's best lineup. */
function marginalIn(activePlayers, player, rosterPositions, valueFor) {
  const before = optimalLineup(activePlayers, rosterPositions, valueFor).total;
  const after = optimalLineup(activePlayers.concat([player]), rosterPositions, valueFor).total;
  return after - before;
}

// ===== src/analysis/roster.js =====
/** Pure roster shaping helpers, shared by the analysis layer and the integrations. */


const RELEVANT = new Set(POSITIONS);

/**
 * A team's players split by whether they can be started this week.
 * IR and taxi players are real assets (tradeable) but must never be handed
 * to the lineup solver, or it will happily start them.
 */
function rosterFor(rosterSlots, teamId, playersById) {
  const active = [];
  const reserve = [];
  for (const slot of rosterSlots) {
    if (slot.teamId !== teamId) continue;
    const player = playersById[slot.playerId];
    if (!player) continue;
    if (slot.slot === ROSTER_SLOT.IR || slot.slot === ROSTER_SLOT.TAXI) reserve.push(player);
    else active.push(player);
  }
  return { active, reserve, all: active.concat(reserve) };
}

function rosteredPlayerIds(rosterSlots) {
  return new Set((rosterSlots || []).map((s) => s.playerId));
}

/**
 * Skill-position players nobody in this league has rostered — the pool that
 * sets replacement level, and the reason a "valuable" bench player may be
 * worth nothing in a trade.
 */
function availablePlayers(playersById, rosterSlots) {
  const taken = rosteredPlayerIds(rosterSlots);
  return Object.keys(playersById)
    .map((id) => playersById[id])
    .filter((p) => p && !taken.has(p.id) && p.nflTeam && RELEVANT.has(p.position));
}

// ===== src/analysis/profile.js =====
/**
 * What a roster is actually made of: where it is strong, where it is thin,
 * and which players are surplus — startable assets beyond what the lineup can
 * use, which is exactly what you trade away.
 */


/** Slots one team must fill at each position, FLEX shared across eligibles. */
function slotsRequired(league) {
  const out = {};
  for (const slot of (league.rosterPositions || []).filter(isScoringSlot)) {
    const eligible = eligiblePositions(slot);
    for (const position of eligible) {
      out[position] = (out[position] || 0) + 1 / eligible.length;
    }
  }
  return out;
}

/**
 * Lineup slots this team genuinely cannot fill, attributed to every position
 * that could have filled them.
 *
 * This replaces an earlier definition that compared starters against
 * `slotsRequired`, which is fractional because a FLEX slot is shared across
 * the positions it accepts. In a QB/RB/RB/WR/WR/TE/FLEX league, RB demand is
 * 2.33, so a team starting exactly two running backs always measured as 0.33
 * "short" — and the team whose FLEX went to a receiver measured short at RB
 * while its neighbour measured short at WR. Live data made this obvious:
 * every one of twelve teams was short at two of three flex positions, so the
 * weakness ranking was being driven by which position happened to win the
 * FLEX rather than by any real hole.
 *
 * A shortfall now means what the words mean: an empty slot.
 */
function shortfallByPosition(lineup) {
  const out = {};
  for (const { slot } of lineup.unfilled || []) {
    for (const position of eligiblePositions(slot)) {
      out[position] = (out[position] || 0) + 1;
    }
  }
  return out;
}

/**
 * @returns per-position strength, exposure, injury risk and surplus for one team.
 */
function teamProfile({ team, roster, league, valueFor, rosFor, levels, weeks }) {
  const active = roster.active || [];
  const lineup = optimalLineup(active, league.rosterPositions, valueFor);
  const starting = new Set(lineup.assignments.map((a) => a.playerId));
  const required = slotsRequired(league);
  const shortfalls = shortfallByPosition(lineup);

  const positions = new Set([
    ...Object.keys(required),
    ...roster.all.map((p) => p.position),
  ]);

  const byPosition = {};
  for (const position of positions) {
    const starters = lineup.assignments.filter((a) => a.position === position);
    const starterStrength = starters.reduce((sum, a) => sum + a.value, 0);

    // Structural exposure: what this position loses if its starters disappear,
    // net of the next man up. Health-agnostic — it measures depth, not luck.
    let exposure = 0;
    let risk = 0;
    for (const starter of starters) {
      const player = active.find((p) => p.id === starter.playerId);
      const cost = marginalOut(active, starter.playerId, league.rosterPositions, valueFor);
      exposure += cost;
      risk += cost * (1 - availabilityFactor(player && player.status, weeks));
    }

    // Surplus: startable value sitting outside the lineup. Bench players below
    // replacement level are not assets, so they contribute nothing.
    const bench = roster.all.filter((p) => p.position === position && !starting.has(p.id));
    const surplusPlayers = bench
      .map((p) => ({ player: p, over: (rosFor(p) || 0) - (levels[position] || 0) }))
      .filter((entry) => entry.over > 0)
      .sort((a, b) => b.over - a.over);

    byPosition[position] = {
      position,
      starterStrength,
      starterCount: starters.length,
      slotsRequired: required[position] || 0,
      shortfall: shortfalls[position] || 0,
      exposure,
      risk,
      surplus: surplusPlayers.reduce((sum, e) => sum + e.over, 0),
      surplusPlayers: surplusPlayers.map((e) => e.player),
      depth: roster.all.filter((p) => p.position === position).length,
    };
  }

  return {
    teamId: team.id,
    teamName: team.teamName,
    ownerName: team.ownerName,
    lineup,
    total: lineup.total,
    unfilled: lineup.unfilled,
    byPosition,
  };
}

/**
 * Profiles for every team plus z-scores, so "weak at RB" is comparable to
 * "weak at TE" — raw point totals are not.
 */
function leagueProfiles({ teams, rosters, league, valueFor, rosFor, levels, weeks }) {
  const profiles = new Map();
  for (const team of teams) {
    profiles.set(
      team.id,
      teamProfile({
        team,
        roster: rosters.get(team.id) || { active: [], reserve: [], all: [] },
        league,
        valueFor,
        rosFor,
        levels,
        weeks,
      })
    );
  }

  const positions = new Set();
  for (const profile of profiles.values()) {
    Object.keys(profile.byPosition).forEach((p) => positions.add(p));
  }

  const stats = {};
  for (const position of positions) {
    const values = [];
    for (const profile of profiles.values()) {
      values.push(profile.byPosition[position] ? profile.byPosition[position].starterStrength : 0);
    }
    const mean = values.reduce((a, b) => a + b, 0) / (values.length || 1);
    const variance = values.reduce((sum, v) => sum + (v - mean) ** 2, 0) / (values.length || 1);
    const sd = Math.sqrt(variance);
    stats[position] = { mean, sd, flat: sd < 1e-9 };
  }

  for (const profile of profiles.values()) {
    for (const position of positions) {
      if (!profile.byPosition[position]) {
        profile.byPosition[position] = {
          position,
          starterStrength: 0,
          starterCount: 0,
          slotsRequired: 0,
          shortfall: 0,
          exposure: 0,
          risk: 0,
          surplus: 0,
          surplusPlayers: [],
          depth: 0,
        };
      }
      const stat = stats[position];
      // A flat league (every team identical) has SD 0; an unguarded divide
      // yields NaN and silently poisons every downstream ranking.
      profile.byPosition[position].z = stat.flat
        ? 0
        : (profile.byPosition[position].starterStrength - stat.mean) / stat.sd;
    }
  }

  return { profiles, stats };
}

/**
 * A team's positions ordered worst-first. Weakness is relative strength plus
 * how exposed the position is if someone goes down.
 */
function weakSpots(profile, { positions = ['QB', 'RB', 'WR', 'TE'] } = {}) {
  return positions
    .map((position) => profile.byPosition[position])
    .filter(Boolean)
    .map((entry) => ({
      ...entry,
      severity: -(entry.z || 0) + (entry.shortfall > 0 ? 2 : 0),
    }))
    .sort((a, b) => b.severity - a.severity);
}

/** Startable assets beyond need, best first — the natural outgoing side of a trade. */
function tradeChips(profile, { positions = ['QB', 'RB', 'WR', 'TE'] } = {}) {
  const chips = [];
  for (const position of positions) {
    const entry = profile.byPosition[position];
    if (!entry) continue;
    for (const player of entry.surplusPlayers) chips.push({ player, position, z: entry.z || 0 });
  }
  return chips;
}

// ===== src/analysis/explain.js =====
/**
 * Structured reasons a trade makes sense.
 *
 * This layer returns FACTS, never sentences — the render layer templates the
 * prose. Keeping strings out of the analysis code is what lets every number
 * in a suggestion be traced back to the data that produced it.
 */

function uniquePositions(players) {
  return [...new Set(players.map((p) => p.position))];
}

/** Slot-by-slot diff between two solved lineups, keyed on slot index. */
function lineupChanges(before, after) {
  const beforeBySlot = new Map(before.assignments.map((a) => [a.slotIndex, a]));
  const afterBySlot = new Map(after.assignments.map((a) => [a.slotIndex, a]));
  const slotIndexes = new Set([...beforeBySlot.keys(), ...afterBySlot.keys()]);
  const changes = [];

  for (const slotIndex of [...slotIndexes].sort((a, b) => a - b)) {
    const from = beforeBySlot.get(slotIndex) || null;
    const to = afterBySlot.get(slotIndex) || null;
    if (from && to && from.playerId === to.playerId) continue;
    changes.push({
      slot: (to || from).slot,
      slotIndex,
      fromPlayerId: from ? from.playerId : null,
      toPlayerId: to ? to.playerId : null,
      delta: (to ? to.value : 0) - (from ? from.value : 0),
    });
  }
  return changes;
}

/**
 * @returns {Array<{kind: string}>} typed facts; the renderer decides wording.
 */
function buildRationale({ myProfile, theirProfile, send, receive, levels, rosFor }) {
  const facts = [];

  for (const position of uniquePositions(send)) {
    const mine = myProfile.byPosition[position];
    if (mine && mine.surplus > 0) {
      facts.push({
        kind: 'surplus',
        position,
        startableCount: mine.starterCount + mine.surplusPlayers.length,
        slotsRequired: Math.round(mine.slotsRequired * 100) / 100,
        surplusValue: Math.round(mine.surplus * 10) / 10,
      });
    }
    const theirs = theirProfile.byPosition[position];
    if (theirs && (theirs.z < 0 || theirs.shortfall > 0)) {
      facts.push({
        kind: 'theirNeed',
        position,
        theirStarterStrength: Math.round(theirs.starterStrength * 10) / 10,
        replacementLevel: Math.round((levels[position] || 0) * 10) / 10,
        theirZ: Math.round((theirs.z || 0) * 100) / 100,
        shortfall: theirs.shortfall,
      });
    }
  }

  for (const position of uniquePositions(receive)) {
    const mine = myProfile.byPosition[position];
    if (mine && (mine.z < 0 || mine.shortfall > 0 || mine.exposure > 0)) {
      facts.push({
        kind: 'myNeed',
        position,
        myZ: Math.round((mine.z || 0) * 100) / 100,
        exposure: Math.round(mine.exposure * 10) / 10,
        shortfall: mine.shortfall,
      });
    }
    const theirs = theirProfile.byPosition[position];
    if (theirs && theirs.surplusPlayers.length > 0) {
      facts.push({
        kind: 'theirSurplus',
        position,
        surplusCount: theirs.surplusPlayers.length,
        surplusValue: Math.round(theirs.surplus * 10) / 10,
      });
    }
  }

  return facts;
}

// ===== src/analysis/trades.js =====
/**
 * Trade search.
 *
 * Every candidate is scored by re-solving BOTH rosters' optimal lineups after
 * the swap. We never compare "trade value" totals — that is the standard way
 * to generate trades nobody accepts, because it ignores that a player's worth
 * depends entirely on the lineup he lands in.
 *
 * Only mutually positive trades are returned. A trade the other manager would
 * refuse is not a suggestion, it is a daydream.
 */


/** Positions where replacement level sits on top of the starter — nobody trades these. */
const UNTRADEABLE = ['K', 'DEF'];

/**
 * Packages, each decorated with the metadata the inner loop needs.
 *
 * Computing position masks, VOR sums and memo keys here rather than per
 * candidate pair matters: there are only ~36 combos per side but ~1300 pairs,
 * so doing it lazily would repeat the same work dozens of times.
 */
function combinations(items, maxSize, required, vor) {
  const out = [];
  const n = items.length;
  for (let size = 1; size <= maxSize; size++) {
    const idx = [];
    (function pick(start) {
      if (idx.length === size) {
        const players = idx.map((i) => items[i]);
        if (!required || players.some((p) => p.id === required)) {
          let mask = 0;
          let vorSum = 0;
          for (const p of players) {
            mask |= POSITION_BIT[p.position] || 0;
            vorSum += Math.max(0, vor(p) || 0);
          }
          out.push({
            players,
            mask,
            vorSum,
            key: players.map((p) => p.id).sort().join('+'),
          });
        }
        return;
      }
      for (let i = start; i < n; i++) {
        idx.push(i);
        pick(i + 1);
        idx.pop();
      }
    })(0);
  }
  return out;
}

function ids(players) {
  return players.map((p) => p.id);
}

/**
 * Post-trade lineup totals, memoised. Packages share sub-rosters heavily, so
 * the cache typically absorbs most of the work in a 2-for-2 search.
 */
function makeSolver(context) {
  const cache = new Map();
  const { league, rosters, reserveIds, valueFor, rosFor } = context;
  const maxRoster = (league.rosterPositions || []).length || Infinity;

  return function solve(teamId, outPlayers, inPlayers, cacheKey) {
    const key =
      cacheKey ||
      teamId + '|' + ids(outPlayers).sort().join('+') + '>' + ids(inPlayers).sort().join('+');
    const hit = cache.get(key);
    if (hit !== undefined) return hit;

    const roster = rosters.get(teamId) || { active: [], reserve: [], all: [] };
    const outSet = new Set(ids(outPlayers));
    let active = roster.active.filter((p) => !outSet.has(p.id));
    const incoming = inPlayers.filter((p) => !reserveIds.has(p.id));
    active = active.concat(incoming);

    // If the trade pushes the roster past its size limit the manager has to
    // cut someone — model it as cutting the least valuable non-starter.
    const totalSize = roster.all.length - outPlayers.length + inPlayers.length;
    let dropped = 0;
    if (totalSize > maxRoster) {
      const excess = totalSize - maxRoster;
      const lineup = optimalLineup(active, league.rosterPositions, valueFor);
      const starting = new Set(lineup.assignments.map((a) => a.playerId));
      const cuttable = active
        .filter((p) => !starting.has(p.id))
        .sort((a, b) => (rosFor(a) || 0) - (rosFor(b) || 0));
      const cut = new Set(ids(cuttable.slice(0, excess)));
      dropped = cut.size;
      active = active.filter((p) => !cut.has(p.id));
    }

    const total = lineupTotal(active, league.rosterPositions, valueFor);
    const result = { total, dropped };
    cache.set(key, result);
    return result;
  };
}

/**
 * @param {object} context  from buildContext()
 * @param {string} myTeamId
 * @param {object} options
 * @returns {{suggestions: Array, scanned: number, evaluated: number, truncated: boolean, elapsedMs: number}}
 */
function findTrades(context, myTeamId, options = {}) {
  const {
    maxSend = 2,
    maxReceive = 2,
    poolSize = 8,
    limit = 25,
    epsilon = 2,
    minMutuality = 0,
    targetPosition = null,
    shopPlayerId = null,
    partnerTeamIds = null,
    budgetMs = 300,
    now = () => Date.now(),
  } = options;

  const started = now();
  const { league, teams, rosters, reserveIds, profiles, vor, rosFor, valueFor, levels, quality } =
    context;
  const rosterPositions = league.rosterPositions;
  const maxRoster = (rosterPositions || []).length || Infinity;
  const solve = makeSolver(context);

  const myProfile = profiles.get(myTeamId);
  const myRoster = rosters.get(myTeamId);
  if (!myProfile || !myRoster) {
    return { suggestions: [], scanned: 0, evaluated: 0, truncated: false, elapsedMs: 0 };
  }

  const tradeable = (teamId) =>
    (rosters.get(teamId) || { all: [] }).all.filter(
      (p) =>
        UNTRADEABLE.indexOf(p.position) === -1 &&
        quality(p) !== 'missing' &&
        typeof rosFor(p) === 'number'
    );

  // My side: surplus first — high abstract value, low cost to give up.
  const myCost = new Map();
  for (const player of tradeable(myTeamId)) {
    myCost.set(player.id, marginalOut(myRoster.active, player.id, league.rosterPositions, valueFor));
  }
  let myPool = tradeable(myTeamId).sort(
    (a, b) => (vor(b) - myCost.get(b.id)) - (vor(a) - myCost.get(a.id))
  );
  if (shopPlayerId) {
    const shopped = myPool.find((p) => p.id === shopPlayerId);
    if (!shopped) {
      return { suggestions: [], scanned: 0, evaluated: 0, truncated: false, elapsedMs: now() - started };
    }
    myPool = [shopped].concat(myPool.filter((p) => p.id !== shopPlayerId).slice(0, poolSize - 1));
  } else {
    myPool = myPool.slice(0, poolSize);
  }

  const myBefore = solve(myTeamId, [], []).total;
  const partners = teams.filter(
    (t) => t.id !== myTeamId && (!partnerTeamIds || partnerTeamIds.indexOf(t.id) !== -1)
  );

  const scored = [];
  let scanned = 0;
  let evaluated = 0;
  let truncated = false;

  for (const partner of partners) {
    if (now() - started > budgetMs) { truncated = true; break; }

    const theirProfile = profiles.get(partner.id);
    const theirRoster = rosters.get(partner.id);
    if (!theirProfile || !theirRoster) continue;

    const theirCandidates = tradeable(partner.id);
    if (!theirCandidates.length) continue;

    // Their side: ranked by what each would add to MY lineup.
    const theirGainToMe = new Map();
    for (const player of theirCandidates) {
      theirGainToMe.set(
        player.id,
        marginalIn(myRoster.active, player, league.rosterPositions, valueFor)
      );
    }
    let theirPool = theirCandidates
      .filter((p) => !targetPosition || p.position === targetPosition)
      .sort((a, b) => theirGainToMe.get(b.id) - theirGainToMe.get(a.id))
      .slice(0, poolSize);
    if (!theirPool.length) continue;

    const theirBefore = solve(partner.id, [], []).total;
    const sendCombos = combinations(myPool, maxSend, shopPlayerId, vor);
    const receiveCombos = combinations(theirPool, maxReceive, null, vor);

    // Which positions are worth giving up / worth acquiring, as bitmasks, so
    // the complementarity test below is a bit-and rather than a set walk.
    let surplusMask = 0;
    let needMask = 0;
    for (const position of Object.keys(POSITION_BIT)) {
      const entry = myProfile.byPosition[position];
      if (!entry) continue;
      if (entry.surplus > 0) surplusMask |= POSITION_BIT[position];
      if (entry.z < 0.5 || entry.shortfall > 0 || entry.exposure > 0) needMask |= POSITION_BIT[position];
    }
    const targetMask = targetPosition ? POSITION_BIT[targetPosition] || 0 : 0;

    // The partner's roster minus each incoming package does not depend on what
    // I send, so resolve it once per package instead of once per pair.
    const theirActive = theirRoster.active;
    const receiveMeta = receiveCombos.map((rc) => {
      const out = new Set(ids(rc.players));
      return {
        ...rc,
        incoming: rc.players.filter((p) => !reserveIds.has(p.id)),
        theirBase: theirActive.filter((p) => !out.has(p.id)),
      };
    });

    const myActive = myRoster.active;
    const mySize = myRoster.all.length;
    const theirSize = theirRoster.all.length;

    for (const send of sendCombos) {
      // Gate 1a — I must be shipping from a position I actually have spare.
      if (!(send.mask & surplusMask)) { scanned += receiveMeta.length; continue; }

      const sendIds = new Set(ids(send.players));
      const myBase = myActive.filter((p) => !sendIds.has(p.id));
      const sendIncoming = send.players.filter((p) => !reserveIds.has(p.id));

      for (const receive of receiveMeta) {
        scanned++;

        // Gate 1b — and receiving into one I lack; otherwise it just reshuffles.
        if (!(receive.mask & needMask)) continue;
        if (targetMask && !(receive.mask & targetMask)) continue;

        // Gate 2 — a very loose sanity band. VOR is the wrong metric for
        // scoring, so this only discards absurd packages before we pay for
        // the lineup solves.
        const hi = Math.max(send.vorSum, receive.vorSum);
        const lo = Math.min(send.vorSum, receive.vorSum);
        if (hi > 0 && lo < hi / 4) continue;

        evaluated++;

        // Uneven packages can push a roster over its size limit, which means
        // someone has to be cut — rare, and handled by the slower path that
        // models the drop.
        const myAfterSize = mySize - send.players.length + receive.players.length;
        const theirAfterSize = theirSize - receive.players.length + send.players.length;
        const needsDrop = myAfterSize > maxRoster || theirAfterSize > maxRoster;

        let myAfter;
        let theirAfter;
        let requiresDrop = false;
        if (needsDrop) {
          const mine = solve(myTeamId, send.players, receive.players, `${myTeamId}|${send.key}>${receive.key}`);
          const theirs = solve(partner.id, receive.players, send.players, `${partner.id}|${receive.key}>${send.key}`);
          myAfter = mine.total;
          theirAfter = theirs.total;
          requiresDrop = mine.dropped > 0 || theirs.dropped > 0;
        } else {
          myAfter = lineupTotal(myBase.concat(receive.incoming), rosterPositions, valueFor);
          theirAfter = lineupTotal(receive.theirBase.concat(sendIncoming), rosterPositions, valueFor);
        }

        const myGain = myAfter - myBefore;
        const theirGain = theirAfter - theirBefore;

        // Epsilon, not zero: floating point noise and tie-flips manufacture
        // sub-point "gains" that are not real.
        if (myGain <= epsilon || theirGain <= epsilon) continue;
        if (minMutuality > 0 && theirGain < minMutuality * myGain) continue;

        scored.push({
          partnerTeamId: partner.id,
          partnerName: partner.teamName,
          partnerOwner: partner.ownerName,
          send: send.players,
          receive: receive.players,
          myGain,
          theirGain,
          mutuality: Math.min(myGain, theirGain) / Math.max(myGain, theirGain),
          requiresDrop,
        });
      }
      if (now() - started > budgetMs) { truncated = true; break; }
    }
  }

  scored.sort(
    (a, b) =>
      b.myGain - a.myGain ||
      b.mutuality - a.mutuality ||
      (a.send.length + a.receive.length) - (b.send.length + b.receive.length)
  );

  const deduped = dropDominatedSupersets(scored);
  const top = deduped.slice(0, limit).map((candidate) =>
    decorate(candidate, { context, myTeamId, myProfile, solve, epsilon })
  );

  return {
    suggestions: top,
    scanned,
    evaluated,
    truncated,
    elapsedMs: now() - started,
  };
}

/** A bigger package that beats none of the smaller ones inside it is noise. */
function dropDominatedSupersets(scored) {
  const kept = [];
  for (const candidate of scored) {
    const size = candidate.send.length + candidate.receive.length;
    const dominated = kept.some((other) => {
      if (other.partnerTeamId !== candidate.partnerTeamId) return false;
      if (other.send.length + other.receive.length >= size) return false;
      const sendIds = new Set(ids(candidate.send));
      const receiveIds = new Set(ids(candidate.receive));
      const subset =
        ids(other.send).every((id) => sendIds.has(id)) &&
        ids(other.receive).every((id) => receiveIds.has(id));
      return subset && other.myGain >= candidate.myGain - 0.01;
    });
    if (!dominated) kept.push(candidate);
  }
  return kept;
}

/** Full lineups and rationale, computed only for the results we actually show. */
function decorate(candidate, { context, myTeamId, myProfile, epsilon }) {
  const { league, rosters, profiles, reserveIds, valueFor, rosFor, vor, levels, quality } = context;
  const theirProfile = profiles.get(candidate.partnerTeamId);

  const build = (teamId, outPlayers, inPlayers) => {
    const roster = rosters.get(teamId);
    const outSet = new Set(ids(outPlayers));
    const active = roster.active
      .filter((p) => !outSet.has(p.id))
      .concat(inPlayers.filter((p) => !reserveIds.has(p.id)));
    return optimalLineup(active, league.rosterPositions, valueFor);
  };

  const myBeforeLineup = build(myTeamId, [], []);
  const myAfterLineup = build(myTeamId, candidate.send, candidate.receive);
  const theirBeforeLineup = build(candidate.partnerTeamId, [], []);
  const theirAfterLineup = build(candidate.partnerTeamId, candidate.receive, candidate.send);

  const startingForMe = new Set(myBeforeLineup.assignments.map((a) => a.playerId));
  const startingForThem = new Set(theirBeforeLineup.assignments.map((a) => a.playerId));
  const willStart = new Set(myAfterLineup.assignments.map((a) => a.playerId));

  const caveats = [];
  if (candidate.requiresDrop) caveats.push('requires-drop');
  for (const player of candidate.send.concat(candidate.receive)) {
    if (quality(player) === 'bye-imputed' && caveats.indexOf('bye-imputed') === -1) {
      caveats.push('bye-imputed');
    }
    if (reserveIds.has(player.id) && caveats.indexOf('reserve-player-included') === -1) {
      caveats.push('reserve-player-included');
    }
  }

  const describe = (player, startingSet, extra) => ({
    playerId: player.id,
    name: player.fullName || player.id,
    position: player.position,
    nflTeam: player.nflTeam || null,
    status: player.status || 'Active',
    ros: Math.round((rosFor(player) || 0) * 10) / 10,
    vor: Math.round((vor(player) || 0) * 10) / 10,
    startsToday: startingSet.has(player.id),
    quality: quality(player),
    ...extra,
  });

  return {
    id: `${myTeamId}>${candidate.partnerTeamId}:${ids(candidate.send).join('+')}>${ids(candidate.receive).join('+')}`,
    partnerTeamId: candidate.partnerTeamId,
    partnerName: candidate.partnerName,
    partnerOwner: candidate.partnerOwner,
    send: candidate.send.map((p) =>
      describe(p, startingForMe, {
        marginalCost: Math.round(
          marginalOut(rosters.get(myTeamId).active, p.id, league.rosterPositions, valueFor) * 10
        ) / 10,
      })
    ),
    receive: candidate.receive.map((p) =>
      describe(p, startingForThem, { wouldStart: willStart.has(p.id) })
    ),
    myGain: Math.round(candidate.myGain * 10) / 10,
    theirGain: Math.round(candidate.theirGain * 10) / 10,
    mutuality: Math.round(candidate.mutuality * 100) / 100,
    epsilonUsed: epsilon,
    myLineupBefore: myBeforeLineup,
    myLineupAfter: myAfterLineup,
    theirLineupBefore: theirBeforeLineup,
    theirLineupAfter: theirAfterLineup,
    lineupChanges: lineupChanges(myBeforeLineup, myAfterLineup),
    rationale: buildRationale({
      myProfile,
      theirProfile,
      send: candidate.send,
      receive: candidate.receive,
      levels,
      rosFor,
    }),
    caveats,
    replacementLevels: levels,
  };
}

// ===== src/analysis/index.js =====
/**
 * Analysis entry point: turn raw league documents into everything the views
 * and the trade engine need, computed once.
 *
 * Pure — no network, no DOM, no storage. Same code runs in Node tests and in
 * the browser bundle.
 */



/**
 * @param {object} input
 * @param {object} input.league
 * @param {Array} input.teams              teams in this league
 * @param {Array} input.rosterSlots        roster slots in this league
 * @param {Object} input.playersById       full player catalogue keyed by id
 * @param {Array} input.projections        projection rows for this league
 * @param {Array} [input.rankings]         positional rankings (used for bye imputation)
 * @param {number} input.currentWeek
 * @param {number} [input.endWeek]
 */
function buildContext({
  league,
  teams,
  rosterSlots,
  playersById,
  projections,
  rankings = [],
  currentWeek,
  endWeek,
}) {
  const weeks = remainingWeeks(currentWeek, endWeek);

  const projectionByPlayer = new Map();
  for (const row of projections || []) {
    if (!row || row.leagueId !== league.id) continue;
    projectionByPlayer.set(row.playerId, row);
  }
  const rankingByPlayer = new Map();
  for (const row of rankings || []) {
    if (row) rankingByPlayer.set(row.playerId, row);
  }

  const allPlayers = Object.keys(playersById).map((id) => playersById[id]).filter(Boolean);
  const values = restOfSeasonValues(allPlayers, {
    projectionFor: (p) => projectionByPlayer.get(p.id),
    rankingFor: (p) => rankingByPlayer.get(p.id),
    weeks,
  });

  const entryFor = (player) => values.get(player.id) || { ros: null, quality: 'missing' };
  const rosFor = (player) => {
    const entry = entryFor(player);
    return typeof entry.ros === 'number' ? entry.ros : null;
  };
  // The lineup solver needs a number; an unknown player is worth nothing to
  // start, which is the honest floor. Trade code filters them out separately.
  const valueFor = (player) => rosFor(player) || 0;
  const quality = (player) => entryFor(player).quality;

  const rosters = new Map();
  const reserveIds = new Set();
  for (const team of teams) {
    const roster = rosterFor(rosterSlots, team.id, playersById);
    rosters.set(team.id, roster);
    roster.reserve.forEach((p) => reserveIds.add(p.id));
  }

  const available = availablePlayers(playersById, rosterSlots);
  const levels = replacementLevels({ league, allPlayers, available, rosFor });
  const vor = (player) => valueOverReplacement(player, rosFor, levels) || 0;

  const { profiles, stats } = leagueProfiles({
    teams,
    rosters,
    league,
    valueFor,
    rosFor,
    levels,
    weeks,
  });

  return {
    league,
    teams,
    rosters,
    reserveIds,
    available,
    playersById,
    weeks,
    levels,
    stats,
    profiles,
    valueFor,
    rosFor,
    vor,
    quality,
    projectionFor: (p) => projectionByPlayer.get(p.id),
  };
}

/** Resolve which roster belongs to a Sleeper user id. Identity is per league. */
function myTeamIn(teams, sleeperUserId) {
  if (!sleeperUserId) return null;
  const match = (teams || []).find((t) => t.ownerId && t.ownerId === sleeperUserId);
  return match ? match.id : null;
}
