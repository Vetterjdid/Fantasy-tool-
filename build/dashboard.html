          el("span", { class: "num", text: n0(entry ? entry.starterStrength : 0) + " pts starting" }), el("br", {}),
          el("span", { class: "num", text: signed(z, 2) + " vs league" }),
          entry && entry.shortfall > 0 ? el("br", {}) : null,
          entry && entry.shortfall > 0 ? el("span", { text: "cannot fill a slot here" }) : null]));
        cell.addEventListener("mouseleave", hideTip);
        return cell;
      });
      const fill = el("i", { class: mine ? "me" : null });
      // Scaled across the league's own range: every roster totals within a
      // quarter of every other, so a zero-based bar discriminates nothing.
      fill.style.width = (10 + ((profile.total - floor) / ((best - floor) || 1)) * 90) + "%";
      return el("tr", {},
        el("td", { class: "team" + (mine ? " me" : ""), title: profile.teamName, text: profile.teamName }),
        cells,
        el("td", { class: "total" }, el("div", { class: "tbar" }, fill), el("span", { class: "num", text: n0(profile.total) })));
    });

    host.append(el("div", { class: "panel", style: "margin-top:16px" },
      el("h2", { text: "Every roster, by position" }),
      el("div", { class: "body" },
        el("div", { class: "heat-scroll" }, el("table", { class: "heat" },
          el("thead", {}, el("tr", {}, el("th", { class: "team-h", text: "Team" }),
            SKILL.map((pos) => el("th", { text: pos })), el("th", { text: "Best lineup" }))),
          el("tbody", {}, body))),
        el("div", { class: "scale" }, el("span", { text: "weak" }),
          el("span", { class: "ramp" }, [-1.75, -1.1, -0.45, 0, 0.45, 1.1, 1.75].map((z) => {
            const swatch = el("i", {});
            swatch.style.background = heatColor(z);
            return swatch;
          })),
          el("span", { text: "strong" }), el("span", { text: "· outlined = a slot that cannot be filled" })),
        el("p", { class: "note", text: "Sorted by best possible lineup. Each cell is that team's starters at the position, against the rest of the league." }))));
  }

  // ---------- trade finder ----------
  const BATCH = 6;

  /** A small, storable record of a suggestion — enough to render it later. */
  function compact(offer) {
    const strip = (p) => ({ playerId: p.playerId, name: p.name, position: p.position,
      nflTeam: p.nflTeam, ros: p.ros, marginalCost: p.marginalCost ?? null, wouldStart: !!p.wouldStart });
    return {
      id: offer.id, partnerTeamId: offer.partnerTeamId, partnerName: offer.partnerName,
      partnerOwner: offer.partnerOwner, myGain: offer.myGain, theirGain: offer.theirGain,
      send: offer.send.map(strip), receive: offer.receive.map(strip),
      changes: offer.lineupChanges.map((c) => ({ slot: c.slot, delta: c.delta,
        from: c.fromPlayerId, to: c.toPlayerId })),
      savedAt: new Date().toISOString(),
    };
  }

  function pool(i) {
    const entry = leagues[i];
    const key = tradeMode + "|" + (tradeMode === "shop" ? shopPlayerId : "");
    if (!entry.pool || entry.pool.key !== key) {
      const options = { limit: 60 };
      if (tradeMode === "shop" && shopPlayerId) options.shopPlayerId = shopPlayerId;
      const result = findTrades(context(i), entry.snap.myTeamId, options);
      entry.pool = { key, result };
      entry.batch = 0;
    }
    return entry.pool.result;
  }

  function renderTrades() {
    const host = $("#view-trades");
    const ctx = context(activeLeague);
    const profile = myProfile();
    host.replaceChildren();

    if (!profile) {
      host.append(el("div", { class: "blank" }, el("h3", { text: "Nothing to trade" }),
        el("p", { text: "You do not own a roster in this league." })));
      return;
    }

    const roster = ctx.rosters.get(profile.teamId);
    const tradable = roster.all.filter((p) => p.position !== "K" && p.position !== "DEF")
      .sort((a, b) => (ctx.rosFor(b) || 0) - (ctx.rosFor(a) || 0));

    const toolbar = el("div", { class: "toolbar" },
      el("div", { class: "seg" },
        el("button", { "aria-pressed": tradeMode === "weakness",
          onclick: () => { tradeMode = "weakness"; renderTrades(); } }, "Fix my weaknesses"),
        el("button", { "aria-pressed": tradeMode === "shop",
          onclick: () => { tradeMode = "shop"; renderTrades(); } }, "Shop a player")));

    if (tradeMode === "shop") {
      if (!shopPlayerId || !tradable.some((p) => p.id === shopPlayerId)) {
        shopPlayerId = tradable.length ? tradable[0].id : null;
      }
      toolbar.append(el("select", { id: "shop-player", "aria-label": "Player to shop",
        onchange: (evt) => { shopPlayerId = evt.target.value; renderTrades(); } },
        tradable.map((p) => el("option", { value: p.id, selected: p.id === shopPlayerId },
          p.fullName + " · " + p.position))));
    }

    const result = pool(activeLeague);
    const board = boardFor(currentLeagueId());
    const hidden = new Set(board.dismissed.concat(board.saved.map((s) => s.id)));

    // Order for variety without throwing anything away: the best two from each
    // manager first, then everything else by rank. One well-matched opponent
    // would otherwise fill the opening screen with variations on a single swap,
    // which reads as one option rather than ten — but capping outright would
    // also hide most of the list, and only four to six managers in a league
    // ever have a workable trade, so a hard cap leaves nothing to page through.
    const available = result.suggestions.filter((offer) => !hidden.has(offer.id));
    const perPartner = new Map();
    const headline = [];
    const rest = [];
    for (const offer of available) {
      const count = perPartner.get(offer.partnerTeamId) || 0;
      perPartner.set(offer.partnerTeamId, count + 1);
      (count < 2 ? headline : rest).push(offer);
    }
    const live = headline.concat(rest);

    const entry = current();
    const pages = Math.max(1, Math.ceil(live.length / BATCH));
    if (entry.batch >= pages) entry.batch = 0;
    const shown = live.slice(entry.batch * BATCH, entry.batch * BATCH + BATCH);

    const lastPage = entry.batch >= pages - 1;
    toolbar.append(el("button", {
      class: "ghost", disabled: live.length <= BATCH,
      title: lastPage ? "Back to the best ones" : "Show the next batch",
      onclick: () => { entry.batch += 1; renderTrades(); window.scrollTo({ top: 0 }); },
    }, el("span", { html: ICON.shuffle }),
      live.length <= BATCH ? "That is all of them" : lastPage ? "Back to the top" : "Show me different ones"));

    host.append(toolbar);

    if (!live.length) {
      const anyFound = result.suggestions.length > 0;
      host.append(el("div", { class: "blank" },
        el("h3", { text: anyFound ? "You have been through them all" : "No trade here that helps both sides" }),
        el("p", { text: anyFound
          ? "Every workable trade in this league is either saved or dismissed. Clear your dismissed list to see them again."
          : tradeMode === "shop"
            ? "Nobody in this league improves their own starting lineup by taking this player — usually because everyone is already deeper than you at his position."
            : "Every package was rejected because it made one side worse. That is the filter working, not a failure: a trade the other manager loses is a trade they decline." }),
        anyFound && board.dismissed.length
          ? el("button", { class: "ghost", onclick: () => {
              const b = boardFor(currentLeagueId());
              boards.set(currentLeagueId(), { saved: b.saved, dismissed: [] });
              persist(currentLeagueId());
              toast("Dismissed trades restored");
              render();
            } }, "Bring back " + board.dismissed.length + " dismissed")
          : null,
        !anyFound ? el("p", { class: "note", text: result.scanned.toLocaleString() + " packages examined." }) : null));
      return;
    }

    host.append(el("p", { class: "note", style: "margin:14px 0 0" },
      "Showing " + (entry.batch * BATCH + 1) + "–" + (entry.batch * BATCH + shown.length) +
      " of " + live.length + " workable trades" +
      (board.dismissed.length ? " · " + board.dismissed.length + " dismissed" : "") +
      ". Both lineups improve in every one."));

    shown.forEach((offer, i) => host.append(offerCard(offer, ctx, i === 0, false)));
  }

  // ---------- saved ----------
  function renderSaved() {
    const host = $("#view-saved");
    const ctx = context(activeLeague);
    host.replaceChildren();
    const board = boardFor(currentLeagueId());

    if (!board.saved.length) {
      host.append(el("div", { class: "blank" },
        el("h3", { text: "Nothing saved yet" }),
        el("p", {}, "Tick the ", el("b", { text: "✓" }), " on a trade in the Trade Finder and it lands here, so you can come back to the ones worth actually proposing."),
        el("p", { class: "note", text: "Saved trades are kept per league and stay put when you close the tab." })));
      return;
    }

    host.append(el("p", { class: "note", style: "margin:16px 0 0" },
      board.saved.length + " saved in " + current().snap.league.name +
      ". Gains were measured when you saved them — reopen the Trade Finder for figures against the current rosters."));

    for (const offer of board.saved) host.append(offerCard(offer, ctx, false, true));
  }

  // ---------- one suggestion ----------
  function offerCard(offer, ctx, openByDefault, isSaved) {
    const sentValue = offer.send.reduce((sum, p) => sum + (p.ros || 0), 0);
    const gotValue = offer.receive.reduce((sum, p) => sum + (p.ros || 0), 0);
    // Mutual lineup gain is necessary but not sufficient: a package where they
    // ship far more raw production than they get back is one a real manager
    // refuses on sight, whatever the optimiser says about their bench.
    const lopsided = gotValue > sentValue * 1.6 && gotValue - sentValue > 120;
    const changes = offer.lineupChanges
      ? offer.lineupChanges.map((c) => ({ slot: c.slot, delta: c.delta, from: c.fromPlayerId, to: c.toPlayerId }))
      : offer.changes || [];

    const card = el("details", { class: "offer" + (isSaved ? " is-saved" : ""), open: !!openByDefault });

    const keep = el("button", {
      class: "act keep" + (isSaved ? " on" : ""), html: ICON.check,
      "aria-label": isSaved ? "Remove from saved" : "Save this trade",
      title: isSaved ? "Remove from saved" : "Save this trade",
      onclick: (evt) => { evt.preventDefault(); evt.stopPropagation(); toggleSaved(offer, isSaved); },
    });
    const drop = el("button", {
      class: "act drop", html: ICON.x,
      "aria-label": isSaved ? "Remove from saved" : "Dismiss this trade",
      title: isSaved ? "Remove from saved" : "Dismiss this trade",
      onclick: (evt) => { evt.preventDefault(); evt.stopPropagation();
        if (isSaved) toggleSaved(offer, true); else dismiss(offer); },
    });

    card.append(el("summary", {},
      el("div", { class: "head" },
        el("div", { class: "partner" }, offer.partnerName || "Team",
          el("span", {}, offer.partnerOwner ? " · " + offer.partnerOwner : "")),
        // The collapsed row has to say what the trade IS — a list of partner
        // names and numbers cannot be scanned.
        el("div", { class: "swap" },
          el("span", { class: "out", text: offer.send.map((p) => p.name).join(" + ") }),
          el("span", { class: "arrow", text: "→" }),
          el("span", { class: "in", text: offer.receive.map((p) => p.name).join(" + ") }))),
      el("div", { class: "gains" },
        el("div", { class: "g mine" }, el("span", { class: "eyebrow", text: "you" }),
          el("b", { text: "+" + n1(offer.myGain) })),
        el("div", { class: "g" }, el("span", { class: "eyebrow", text: "them" }),
          el("b", { text: "+" + n1(offer.theirGain) }))),
      el("div", { class: "acts" }, keep, drop)));

    const leg = (label, players, showCost) => el("div", { class: "leg" },
      el("span", { class: "eyebrow", text: label }),
      players.map((p) => playerRow(
        { fullName: p.name, position: p.position, nflTeam: p.nflTeam, status: "Active" },
        p.ros,
        { starts: !!p.wouldStart,
          after: showCost && p.marginalCost !== null && p.marginalCost !== undefined
            ? "costs you " + n0(p.marginalCost) : null })));

    card.append(el("div", { class: "legs" },
      leg("You send", offer.send, true), leg("You receive", offer.receive, false)));

    const ledger = el("div", { class: "ledger" },
      el("span", { class: "eyebrow", text: "Where your gain comes from" }),
      changes.map((change) => {
        const from = change.from ? ctx.playersById[change.from] : null;
        const to = change.to ? ctx.playersById[change.to] : null;
        return el("div", { class: "row" },
          el("span", { class: "slotname", text: change.slot }),
          el("span", {}, to ? to.fullName : "nobody",
            from ? " replaces " + from.fullName : " fills an empty slot"),
          el("span", { class: "d " + (change.delta >= 0 ? "up" : "down"), text: signed(change.delta, 1) }));
      }));

    if (lopsided) {
      ledger.append(el("span", { class: "caution" },
        "Lopsided on paper. You take back " + n0(gotValue - sentValue) +
        " more points of production than you give up. Their lineup still improves — the players they send are stuck behind better ones — but expect this to read as a fleece and get declined."));
    }
    if (offer.caveats && offer.caveats.length) {
      ledger.append(el("p", { class: "note", text: "Note: " + offer.caveats.join(", ") + "." }));
    }
    card.append(ledger);
    return card;
  }

  function toggleSaved(offer, currentlySaved) {
    const leagueId = currentLeagueId();
    const board = boardFor(leagueId);
    if (currentlySaved) {
      boards.set(leagueId, { saved: board.saved.filter((s) => s.id !== offer.id), dismissed: board.dismissed });
      toast("Removed from saved");
    } else {
      boards.set(leagueId, {
        saved: board.saved.concat([compact(offer)]),
        dismissed: board.dismissed.filter((id) => id !== offer.id),
      });
      toast("Saved — see the Saved tab");
    }
    persist(leagueId);
    render();
  }

  function dismiss(offer) {
    const leagueId = currentLeagueId();
    const board = boardFor(leagueId);
    if (board.dismissed.includes(offer.id)) return;
    boards.set(leagueId, { saved: board.saved, dismissed: board.dismissed.concat([offer.id]) });
    persist(leagueId);
    toast("Dismissed");
    render();
  }

  // ---------- chrome ----------
  function renderChrome() {
    $("#who").textContent = SNAPSHOT.identity.displayName || SNAPSHOT.identity.sleeperUsername || "";

    const when = new Date(SNAPSHOT.meta.fetchedAt);
    $("#stamp").replaceChildren(
      el("div", { text: SNAPSHOT.meta.season + " · week " + SNAPSHOT.meta.currentWeek }),
      el("div", { text: "rosters " + when.toLocaleDateString(undefined, { month: "short", day: "numeric" }) }));

    $("#leagues").replaceChildren(...leagues.map((entry, i) => {
      const tab = el("button", { class: "pill", role: "tab", "aria-selected": i === activeLeague,
        onclick: () => { activeLeague = i; render(); } }, entry.snap.league.name);
      if (entry.ctx && entry.snap.myTeamId) {
        const rank = standings(entry.ctx).findIndex((p) => p.teamId === entry.snap.myTeamId) + 1;
        if (rank > 0) tab.append(el("span", { class: "rank", text: rank + "/" + entry.ctx.teams.length }));
      }
      return tab;
    }));

    const savedCount = boardFor(currentLeagueId()).saved.length;
    const savedTab = $("#tab-saved");
    savedTab.replaceChildren(document.createTextNode("Saved"));
    if (savedCount) savedTab.append(el("span", { class: "count", text: String(savedCount) }));

    for (const view of ["team", "league", "trades", "saved"]) {
      $("#tab-" + view).setAttribute("aria-selected", String(view === activeView));
      $("#view-" + view).hidden = view !== activeView;
    }

    const league = current().snap.league;
    $("#footnote").replaceChildren(
      el("p", {}, el("b", { text: "Points are rest-of-season totals" }),
        " — a weekly projection across the " + context(activeLeague).weeks +
        " weeks left, discounted for injury status. " + league.scoringType.replace("_", "-").toUpperCase() +
        " scoring, " + league.totalRosters + " teams."),
      el("p", { text: "Projections: " + SNAPSHOT.meta.projectionSource + ". Last season's production is a starting " +
        "point, not a forecast — it knows nothing about team changes or depth charts, and rookies have no line at " +
        "all, so they carry no projection rather than a zero." }),
      el("p", { text: "A trade only appears if both teams' best possible lineups improve. Value is measured against " +
        "your own roster: a player you cannot start is worth nothing to you, however good he is." }));
  }

  function render() {
    renderChrome();
    if (activeView === "team") renderTeam();
    else if (activeView === "league") renderLeague();
    else if (activeView === "trades") renderTrades();
    else renderSaved();
    renderChrome();   // league ranks need the context the view just built
  }

  for (const view of ["team", "league", "trades", "saved"]) {
    $("#tab-" + view).addEventListener("click", () => { activeView = view; render(); });
  }
  window.addEventListener("scroll", hideTip, { passive: true });

  readLocal();
  render();
  connectStore();
})();
</script>
