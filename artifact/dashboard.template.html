<title>War Room</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Sleeper is a dark-only app, so this page commits to one visual world
     rather than offering a light theme. Every colour is painted explicitly so
     the page holds on whatever ground the viewer's host paints behind it. */
  :root {
    color-scheme: dark;

    --bg:        #0E1116;
    --raise:     #161B22;
    --raise-2:   #1C232C;
    --sunk:      #0A0D11;
    --line:      #232C37;
    --line-soft: #1A222B;

    --ink:       #F2F5F8;
    --ink-2:     #9AA7B6;
    --ink-3:     #6A7787;

    /* Sleeper's position colours — the most recognisable thing about the app.
       They are identity, not severity: a colour says "running back", never
       "bad". Severity is the diverging pair below. */
    --qb:  #FF2A6D;
    --rb:  #00CEB8;
    --wr:  #58A7FF;
    --te:  #FFAE58;
    --k:   #BD66FF;
    --def: #7D8797;

    /* Polarity: above or below the league. Kept apart from position colour. */
    --cool: #2E9CBC;
    --warm: #D4703C;
    --good: #2BD98C;
    --bad:  #FF5C5C;

    --shadow: 0 1px 2px rgb(0 0 0 / .5), 0 12px 32px -16px rgb(0 0 0 / .8);
    --sans: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --r: 14px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 72px; }
  header .wrap { padding-block: 0; }

  h1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--wr); outline-offset: 2px; border-radius: 8px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- top chrome ---------- */
  header { background: var(--sunk); border-bottom: 1px solid var(--line-soft); position: sticky; top: 0; z-index: 10; }
  .masthead { display: flex; align-items: center; gap: 12px; padding-block: 13px 11px; flex-wrap: wrap; }
  .mark {
    width: 32px; height: 32px; border-radius: 10px; flex: none; display: grid; place-items: center;
    background: linear-gradient(160deg, var(--rb), #009E8D); color: #052; font-weight: 800; font-size: 15px;
  }
  .masthead h1 { font-size: 18px; }
  .masthead .who { color: var(--ink-3); font-size: 13px; font-weight: 600; }
  .masthead .stamp { margin-left: auto; text-align: right; color: var(--ink-3); font-size: 11.5px; font-weight: 600; line-height: 1.35; }

  .pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
  .pills::-webkit-scrollbar { display: none; }
  .pill {
    border: 1px solid var(--line); background: var(--raise); color: var(--ink-2);
    border-radius: 999px; padding: 7px 15px; font-size: 13px; font-weight: 700; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .pill:hover { color: var(--ink); border-color: #32404F; }
  .pill[aria-selected="true"] { background: var(--ink); color: #0B0E12; border-color: var(--ink); }
  .pill .rank { font-family: var(--mono); font-size: 11px; opacity: .7; font-weight: 500; }

  .tabs { display: flex; gap: 6px; padding: 16px 0 4px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    border: 0; background: transparent; color: var(--ink-3); border-radius: 10px;
    padding: 8px 14px; font-size: 14px; font-weight: 700; white-space: nowrap;
  }
  .tab:hover { color: var(--ink); background: var(--raise); }
  .tab[aria-selected="true"] { color: var(--ink); background: var(--raise-2); }
  .tab .count {
    font-family: var(--mono); font-size: 11px; margin-left: 6px; padding: 1px 6px;
    border-radius: 999px; background: var(--rb); color: #042; font-weight: 600;
  }

  section.view[hidden] { display: none; }

  /* ---------- headline facts ---------- */
  .facts { display: flex; flex-wrap: wrap; gap: 12px; padding: 18px 0 4px; }
  .fact { flex: 1 1 150px; background: var(--raise); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 13px 15px; }
  .fact .eyebrow { display: block; margin-bottom: 5px; }
  .fact .v { font-size: 25px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
  .fact .v small { font-size: 13px; color: var(--ink-3); font-weight: 700; letter-spacing: 0; }

  .split { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; padding-top: 16px; align-items: start; }
  @media (max-width: 860px) { .split { grid-template-columns: minmax(0, 1fr); } }

  .panel { background: var(--raise); border: 1px solid var(--line-soft); border-radius: var(--r); overflow: hidden; }
  .panel + .panel { margin-top: 14px; }
  .panel > h2 { font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3);
                padding: 14px 15px 10px; }
  .panel .body { padding: 0 15px 14px; }
  .note { color: var(--ink-3); font-size: 12.5px; font-weight: 600; margin: 8px 0 0; line-height: 1.5; }

  /* ---------- player rows, Sleeper-style ---------- */
  .prow { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
  .prow:last-child { border-bottom: 0; }
  .slot {
    flex: none; width: 42px; font-family: var(--mono); font-size: 11px; font-weight: 600;
    color: var(--ink-3); letter-spacing: .04em;
  }
  .av {
    flex: none; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
    font-size: 12px; font-weight: 800; letter-spacing: -.02em; color: #0B0E12;
  }
  .av.empty { background: var(--raise-2); color: var(--ink-3); border: 1px dashed var(--line); }
  .pmain { flex: 1; min-width: 0; }
  .pname { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pmeta { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 11.5px; font-weight: 700; color: var(--ink-3); }
  .pos {
    font-size: 10px; font-weight: 800; letter-spacing: .04em; padding: 1px 5px; border-radius: 4px; color: #0B0E12;
  }
  .ppts { flex: none; font-family: var(--mono); font-size: 14px; font-weight: 600; text-align: right; min-width: 46px; }
  .tagline { font-size: 10px; font-weight: 800; letter-spacing: .04em; padding: 1px 5px; border-radius: 4px; border: 1px solid; }
  .tagline.hurt { color: var(--bad); border-color: color-mix(in oklab, var(--bad) 45%, transparent); }
  .tagline.nodata { color: var(--ink-3); border-color: var(--line); }
  .tagline.starts { color: var(--good); border-color: color-mix(in oklab, var(--good) 45%, transparent); }
  .prow.dim .pname, .prow.dim .ppts { color: var(--ink-2); }
  .prow.gap .pname { color: var(--warm); font-style: italic; font-weight: 600; }

  /* ---------- diverging strength bars ---------- */
  .bars { display: grid; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 30px 1fr 46px; align-items: center; gap: 10px; }
  .track { position: relative; height: 16px; background: var(--sunk); border-radius: 4px; }
  .track::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--line); }
  .track i { position: absolute; top: 3px; bottom: 3px; border-radius: 2px; }
  .bar-row .z { font-family: var(--mono); font-size: 12px; font-weight: 500; text-align: right; }

  .ranked { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
  .ranked li { display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 600; }
  .ranked .why { color: var(--ink-3); font-size: 12.5px; }

  /* ---------- heatmap ---------- */
  .heat-scroll { overflow-x: auto; }
  .heat { border-collapse: separate; border-spacing: 3px; font-size: 13px; min-width: 560px; }
  .heat th { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
             color: var(--ink-3); padding: 0 6px 6px; text-align: center; }
  .heat th.team-h { text-align: left; }
  .heat td.team { font-weight: 700; font-size: 13.5px; white-space: nowrap; padding-right: 10px;
                  max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .heat td.team.me { color: var(--rb); }
  .heat .cell { width: 58px; text-align: center; font-family: var(--mono); font-size: 12.5px; font-weight: 500;
                padding: 8px 4px; border-radius: 8px; color: var(--ink); cursor: default; }
  .heat .cell.hole { outline: 1.5px solid var(--warm); outline-offset: -1.5px; font-weight: 600; }
  .heat .total { width: 150px; padding-left: 10px; }
  .heat .tbar { height: 7px; background: var(--sunk); border-radius: 4px; position: relative; margin-bottom: 3px; }
  .heat .tbar i { position: absolute; inset: 0 auto 0 0; background: var(--ink-3); border-radius: 4px; }
  .heat .tbar i.me { background: var(--rb); }
  .heat .total span { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .scale { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 12px; font-weight: 600; color: var(--ink-3); flex-wrap: wrap; }
  .scale .ramp { display: flex; height: 9px; border-radius: 3px; overflow: hidden; width: 170px; }
  .scale .ramp i { flex: 1; }

  /* ---------- trade cards ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; padding: 16px 0 2px; }
  .seg { display: inline-flex; background: var(--raise); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: transparent; color: var(--ink-3); border-radius: 8px; padding: 7px 13px; font-size: 13px; font-weight: 700; }
  .seg button[aria-pressed="true"] { background: var(--raise-2); color: var(--ink); }
  .ghost {
    border: 1px solid var(--line); background: var(--raise); color: var(--ink); border-radius: 11px;
    padding: 8px 15px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px;
  }
  .ghost:hover { border-color: #32404F; background: var(--raise-2); }
  .ghost:disabled { opacity: .45; cursor: default; }
  select {
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--raise);
    border: 1px solid var(--line); border-radius: 11px; padding: 8px 11px; max-width: 100%;
  }

  .offer { background: var(--raise); border: 1px solid var(--line-soft); border-radius: var(--r); margin-top: 12px; box-shadow: var(--shadow); }
  .offer.is-saved { border-color: color-mix(in oklab, var(--good) 40%, var(--line-soft)); }
  .offer > summary { list-style: none; cursor: pointer; padding: 13px 14px; display: flex; gap: 12px; align-items: flex-start; }
  .offer > summary::-webkit-details-marker { display: none; }
  .offer[open] > summary { border-bottom: 1px solid var(--line-soft); }
  .offer .head { flex: 1; min-width: 0; }
  .offer .partner { font-size: 14.5px; font-weight: 800; }
  .offer .partner span { color: var(--ink-3); font-weight: 700; font-size: 12.5px; }
  /* Deliberately not a flex row: as inline text the line wraps like a
     sentence, instead of stranding the arrow alone on a line of its own. */
  .offer .swap { margin-top: 4px; font-size: 13px; font-weight: 600; }
  .offer .swap .out { color: var(--ink-3); }
  .offer .swap .in { color: var(--ink); font-weight: 700; }
  .offer .swap .arrow { color: var(--rb); font-weight: 800; padding: 0 5px; }

  /* At phone width the summary stacks, with the numbers and the two controls
     sharing one row rather than each wrapping onto its own. */
  @media (max-width: 560px) {
    .offer > summary { flex-wrap: wrap; }
    .offer .head { flex: 1 1 100%; }
    .gains { flex: 1; }
    .acts { margin-left: auto; }
  }

  .gains { display: flex; gap: 14px; align-items: baseline; white-space: nowrap; flex: none; }
  .gains .g { text-align: right; }
  .gains .g b { font-family: var(--mono); font-size: 18px; font-weight: 600; display: block; letter-spacing: -.02em; }
  .gains .mine b { color: var(--good); }
  .gains .g .eyebrow { font-size: 9.5px; }

  /* dismiss / save — deliberately outside the summary's click target */
  .acts { display: flex; gap: 6px; flex: none; align-self: center; }
  .act {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--raise-2); color: var(--ink-3); display: grid; place-items: center; padding: 0;
  }
  .act:hover { color: var(--ink); border-color: #3A4757; }
  .act.keep:hover { color: var(--good); border-color: color-mix(in oklab, var(--good) 50%, transparent); }
  .act.drop:hover { color: var(--bad); border-color: color-mix(in oklab, var(--bad) 50%, transparent); }
  .act.on { color: var(--good); border-color: color-mix(in oklab, var(--good) 55%, transparent); background: color-mix(in oklab, var(--good) 14%, var(--raise-2)); }
  .act svg { width: 16px; height: 16px; }

  .legs { display: grid; grid-template-columns: 1fr 1fr; }
  @media (max-width: 640px) { .legs { grid-template-columns: 1fr; } }
  .leg { padding: 12px 14px; }
  .leg + .leg { border-left: 1px solid var(--line-soft); }
  @media (max-width: 640px) { .leg + .leg { border-left: 0; border-top: 1px solid var(--line-soft); } }
  .leg > .eyebrow { display: block; margin-bottom: 6px; }

  .ledger { padding: 11px 14px 14px; border-top: 1px solid var(--line-soft); }
  .ledger .row { display: flex; gap: 9px; align-items: baseline; font-size: 13px; font-weight: 600; padding: 3px 0; }
  .ledger .row .slotname { font-family: var(--mono); font-size: 11px; color: var(--ink-3); width: 52px; flex: none; }
  .ledger .row .d { font-family: var(--mono); font-variant-numeric: tabular-nums; margin-left: auto; flex: none; }
  .up { color: var(--good); } .down { color: var(--bad); }
  .caution { display: block; margin-top: 10px; padding: 9px 11px; border-radius: 10px; font-size: 12.5px; font-weight: 600; line-height: 1.5;
             background: color-mix(in oklab, var(--warm) 12%, transparent); color: #F0A87A;
             border: 1px solid color-mix(in oklab, var(--warm) 30%, transparent); }

  .blank { padding: 36px 4px; color: var(--ink-2); max-width: 60ch; }
  .blank h3 { font-size: 17px; color: var(--ink); margin-bottom: 7px; }
  .blank p { margin: 0 0 8px; font-size: 14px; font-weight: 600; line-height: 1.55; }

  #tip {
    position: fixed; z-index: 40; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--raise-2); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
    padding: 8px 10px; font-size: 12.5px; font-weight: 600; max-width: 240px; line-height: 1.45;
  }
  #toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(12px); z-index: 50;
    background: var(--ink); color: #0B0E12; border-radius: 999px; padding: 9px 18px;
    font-size: 13px; font-weight: 800; opacity: 0; transition: opacity .16s, transform .16s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer { margin-top: 34px; padding-top: 15px; border-top: 1px solid var(--line-soft); color: var(--ink-3); font-size: 12px; font-weight: 600; max-width: 74ch; line-height: 1.6; }
  footer p { margin: 0 0 7px; }
  footer b { color: var(--ink-2); }
</style>

<header>
  <div class="wrap">
    <div class="masthead">
      <span class="mark">W</span>
      <h1>War Room</h1>
      <span class="who" id="who"></span>
      <span class="stamp" id="stamp"></span>
    </div>
    <nav class="pills" id="leagues" role="tablist" aria-label="Leagues"></nav>
  </div>
</header>

<div class="wrap">
  <nav class="tabs" id="tabs" role="tablist" aria-label="Views">
    <button class="tab" id="tab-team" role="tab" aria-selected="true" aria-controls="view-team">My Team</button>
    <button class="tab" id="tab-league" role="tab" aria-selected="false" aria-controls="view-league">League</button>
    <button class="tab" id="tab-trades" role="tab" aria-selected="false" aria-controls="view-trades">Trade Finder</button>
    <button class="tab" id="tab-saved" role="tab" aria-selected="false" aria-controls="view-saved">Saved</button>
  </nav>

  <main>
    <section class="view" id="view-team" role="tabpanel" aria-labelledby="tab-team"></section>
    <section class="view" id="view-league" role="tabpanel" aria-labelledby="tab-league" hidden></section>
    <section class="view" id="view-trades" role="tabpanel" aria-labelledby="tab-trades" hidden></section>
    <section class="view" id="view-saved" role="tabpanel" aria-labelledby="tab-saved" hidden></section>
  </main>

  <footer id="footnote"></footer>
</div>

<div id="tip" role="status"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>

<script>
(function () {
  "use strict";
  const SNAPSHOT = <!--INJECT:data-->;

  // ---------- helpers ----------
  const $ = (sel) => document.querySelector(sel);
  const el = (tag, attrs, ...kids) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k === "html") node.innerHTML = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? "" : String(v));
    }
    for (const kid of kids.flat()) {
      if (kid === null || kid === undefined || kid === false) continue;
      node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return node;
  };
  const n0 = (v) => Math.round(v).toLocaleString();
  const n1 = (v) => (Math.round(v * 10) / 10).toFixed(1);
  const signed = (v, d) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d);
  const ordinal = (i) => i + ["th", "st", "nd", "rd"][(i % 100 >= 11 && i % 100 <= 13) || i % 10 > 3 ? 0 : i % 10];
  const SKILL = ["QB", "RB", "WR", "TE"];
  const POS_VAR = { QB: "--qb", RB: "--rb", WR: "--wr", TE: "--te", K: "--k", DEF: "--def" };
  const posColor = (position) => "var(" + (POS_VAR[position] || "--def") + ")";

  const ICON = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4.5 4.5L19 7"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    shuffle: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.5-5.9M20 3v4h-4"/></svg>',
  };

  /** Sleeper reports "Unknown" for every team defense — that is not an injury. */
  const isHurt = (status) => !!status && !/^(active|unknown)$/i.test(String(status));
  function shortStatus(status) {
    const s = String(status);
    if (/injured reserve|^ir$/i.test(s)) return "IR";
    if (/questionable/i.test(s)) return "Q";
    if (/doubtful/i.test(s)) return "D";
    if (/^out/i.test(s)) return "OUT";
    return s.slice(0, 3).toUpperCase();
  }
  function initials(name) {
    const parts = String(name || "?").split(/\s+/).filter(Boolean);
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }
  /** Diverging fill for a z-score. Warm below the league, cool above. */
  function heatColor(z) {
    const c = Math.max(-1.75, Math.min(1.75, z || 0));
    const strength = Math.round((Math.abs(c) / 1.75) * 74);
    return "color-mix(in oklab, " + (c >= 0 ? "var(--cool)" : "var(--warm)") + " " + strength + "%, var(--sunk))";
  }

  // ---------- state ----------
  const leagues = SNAPSHOT.leagues.map((snap) => ({ snap, ctx: null, pool: null, batch: 0 }));
  let activeLeague = 0;
  let activeView = "team";
  let tradeMode = "weakness";
  let shopPlayerId = null;

  /** Per-league board: which suggestions were kept and which were thrown out. */
  const boards = new Map();   // leagueId -> {saved: [...], dismissed: [ids]}
  const emptyBoard = () => ({ saved: [], dismissed: [] });
  const boardFor = (leagueId) => boards.get(leagueId) || emptyBoard();

  function context(i) {
    const entry = leagues[i];
    if (!entry.ctx) {
      entry.ctx = buildContext({
        league: entry.snap.league,
        teams: entry.snap.teams,
        rosterSlots: entry.snap.rosterSlots,
        playersById: entry.snap.players,
        projections: entry.snap.projections,
        rankings: [],
        currentWeek: SNAPSHOT.meta.currentWeek,
      });
    }
    return entry.ctx;
  }
  const current = () => leagues[activeLeague];
  const currentLeagueId = () => current().snap.league.id;
  const myProfile = () => context(activeLeague).profiles.get(current().snap.myTeamId) || null;
  const standings = (ctx) => [...ctx.profiles.values()].sort((a, b) => b.total - a.total);

  // ---------- persistence ----------
  // Two stores, because they fail differently. localStorage is instant and
  // always there but lives in one browser; the artifact database survives a
  // new device and a republish. Writes go to both; on load the database wins,
  // because it is the one that can have been updated somewhere else.
  let db = null;
  const LS_KEY = "warroom.board.v1";

  function readLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      for (const [leagueId, board] of Object.entries(parsed || {})) {
        boards.set(leagueId, { saved: board.saved || [], dismissed: board.dismissed || [] });
      }
    } catch (err) { /* private window, or cleared site data — start empty */ }
  }
  function writeLocal() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(Object.fromEntries(boards)));
    } catch (err) { /* over quota or blocked; the database is still authoritative */ }
  }
  function persist(leagueId) {
    writeLocal();
    if (!db) return;
    // Path segments accept ':' so a Sleeper league id needs no mangling.
    db.doc("tradeboard/" + leagueId).set(boardFor(leagueId)).catch(() => {
      toast("Saved on this device only — could not reach storage");
    });
  }
  async function connectStore() {
    if (!window.claude || !window.claude.use) return;
    try {
      db = await window.claude.use("db");
    } catch (err) { db = null; }
    if (!db) return;
    for (const entry of leagues) {
      const leagueId = entry.snap.league.id;
      db.doc("tradeboard/" + leagueId).onSnapshot((snap) => {
        if (!snap.exists) return;
        const data = snap.data() || {};
        boards.set(leagueId, { saved: data.saved || [], dismissed: data.dismissed || [] });
        render();
      }, () => { /* subscription died; local copy keeps working */ });
    }
  }

  let toastTimer = null;
  function toast(message) {
    const node = $("#toast");
    node.textContent = message;
    node.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => node.classList.remove("show"), 2200);
  }

  // ---------- tooltip ----------
  const tip = $("#tip");
  function showTip(evt, nodes) {
    tip.replaceChildren(...nodes);
    tip.style.opacity = "1";
    const box = tip.getBoundingClientRect();
    tip.style.left = Math.min(evt.clientX + 14, window.innerWidth - box.width - 10) + "px";
    tip.style.top = Math.max(8, evt.clientY - box.height - 12) + "px";
  }
  const hideTip = () => { tip.style.opacity = "0"; };

  // ---------- shared fragments ----------
  function avatar(player) {
    const node = el("span", { class: "av", text: initials(player.fullName) });
    node.style.background = posColor(player.position);
    return node;
  }
  function playerRow(player, points, opts = {}) {
    const meta = el("span", { class: "pmeta" });
    const chip = el("span", { class: "pos", text: player.position });
    chip.style.background = posColor(player.position);
    meta.append(chip, el("span", { text: player.nflTeam || "FA" }));
    if (isHurt(player.status)) meta.append(el("span", { class: "tagline hurt", text: shortStatus(player.status) }));
    if (opts.quality === "missing") meta.append(el("span", { class: "tagline nodata", text: "no 2025 data" }));
    if (opts.starts) meta.append(el("span", { class: "tagline starts", text: "starts" }));
    if (opts.after) meta.append(el("span", { text: opts.after }));

    return el("div", { class: "prow" + (opts.dim ? " dim" : "") },
      opts.slot ? el("span", { class: "slot", text: opts.slot }) : null,
      avatar(player),
      el("span", { class: "pmain" }, el("span", { class: "pname", text: player.fullName }), meta),
      el("span", { class: "ppts num", text: points === null || points === undefined ? "—" : n0(points) }));
  }

  function strengthBars(profile) {
    return el("div", { class: "bars" }, SKILL.map((pos) => {
      const entry = profile.byPosition[pos];
      const z = entry ? entry.z || 0 : 0;
      const bar = el("i", {});
      bar.style.background = z >= 0 ? "var(--cool)" : "var(--warm)";
      bar.style.width = Math.min(50, (Math.abs(z) / 2) * 50) + "%";
      if (z >= 0) bar.style.left = "50%"; else bar.style.right = "50%";
      const label = el("span", { class: "pos", text: pos });
      label.style.background = posColor(pos);
      return el("div", { class: "bar-row" }, label, el("div", { class: "track" }, bar),
        el("span", { class: "z num", text: signed(z, 2) }));
    }));
  }

  // ---------- view: my team ----------
  function renderTeam() {
    const host = $("#view-team");
    const ctx = context(activeLeague);
    const profile = myProfile();
    host.replaceChildren();

    if (!profile) {
      host.append(el("div", { class: "blank" },
        el("h3", { text: "No roster here under your name" }),
        el("p", { text: "Sleeper lists this league, but none of its rosters is owned by " +
          SNAPSHOT.identity.displayName + " — usually a league left mid-season. The League tab still works." })));
      return;
    }

    const weak = weakSpots(profile);
    const chips = tradeChips(profile);
    const rank = standings(ctx).findIndex((p) => p.teamId === profile.teamId) + 1;
    const worst = weak[0];

    host.append(el("div", { class: "facts" },
      el("div", { class: "fact" }, el("span", { class: "eyebrow", text: "Best lineup" }),
        el("div", { class: "v num" }, n0(profile.total), " ", el("small", { text: "pts" }))),
      el("div", { class: "fact" }, el("span", { class: "eyebrow", text: "League rank" }),
        el("div", { class: "v" }, ordinal(rank), " ", el("small", { text: "of " + ctx.teams.length }))),
      el("div", { class: "fact" }, el("span", { class: "eyebrow", text: "Thinnest spot" }),
        el("div", { class: "v" }, worst ? worst.position : "—", " ",
          el("small", { class: "num", text: worst ? signed(worst.z || 0, 2) : "" })))));

    const assigned = new Map(profile.lineup.assignments.map((a) => [a.slotIndex, a]));
    const lineupRows = current().snap.league.rosterPositions
      .map((slot, i) => ({ slot, i }))
      .filter(({ slot }) => isScoringSlot(slot))
      .map(({ slot, i }) => {
        const a = assigned.get(i);
        if (!a) {
          return el("div", { class: "prow gap" },
            el("span", { class: "slot", text: slot }),
            el("span", { class: "av empty", text: "—" }),
            el("span", { class: "pmain" }, el("span", { class: "pname", text: "nobody eligible" })),
            el("span", { class: "ppts num", text: "0" }));
        }
        const player = ctx.playersById[a.playerId];
        return playerRow(player, a.value, { slot, quality: ctx.quality(player) });
      });

    const starting = new Set(profile.lineup.assignments.map((a) => a.playerId));
    const roster = ctx.rosters.get(profile.teamId);
    const bench = roster.all.filter((p) => !starting.has(p.id))
      .sort((a, b) => (ctx.rosFor(b) || 0) - (ctx.rosFor(a) || 0));

    const left = el("div", {},
      el("div", { class: "panel" }, el("h2", { text: "Starting lineup" }),
        el("div", { class: "body" }, lineupRows)),
      el("div", { class: "panel" }, el("h2", { text: "Bench · " + bench.length }),
        el("div", { class: "body" },
          bench.map((p) => playerRow(p, ctx.rosFor(p), { slot: "BN", dim: true, quality: ctx.quality(p) })),
          el("p", { class: "note", text:
            "A bench player is worth nothing to your lineup until someone ahead of him is gone — which is exactly what makes him tradeable." }))));

    const right = el("div", {},
      el("div", { class: "panel" }, el("h2", { text: "Strength by position" }),
        el("div", { class: "body" }, strengthBars(profile),
          el("p", { class: "note", text: "Standard deviations from the league average at that position." }))),
      el("div", { class: "panel" }, el("h2", { text: "Weakest first" }),
        el("div", { class: "body" }, el("ul", { class: "ranked" }, weak.map((entry) => {
          const chip = el("span", { class: "pos", text: entry.position });
          chip.style.background = posColor(entry.position);
          return el("li", {}, chip, el("span", { class: "num", text: signed(entry.z || 0, 2) }),
            el("span", { class: "why", text: entry.shortfall > 0 ? "a slot you cannot fill"
              : entry.exposure > 0 && entry.z < 0 ? n0(entry.exposure) + " pts ride on the starters" : "" }));
        })))),
      el("div", { class: "panel" }, el("h2", { text: "Trade chips" }),
        el("div", { class: "body" }, chips.length
          ? chips.slice(0, 6).map((chip) => playerRow(chip.player, ctx.rosFor(chip.player), {
              after: "costs you " + n0(marginalOut(roster.active, chip.player.id,
                current().snap.league.rosterPositions, ctx.valueFor)) + " to lose" }))
          : el("p", { class: "note", text: "Nothing spare — every startable player you own is already starting." }))));

    host.append(el("div", { class: "split" }, left, right));
  }

  // ---------- view: league ----------
  function renderLeague() {
    const host = $("#view-league");
    const ctx = context(activeLeague);
    host.replaceChildren();

    const rows = standings(ctx);
    const best = Math.max(...rows.map((p) => p.total));
    const floor = Math.min(...rows.map((p) => p.total));

    const body = rows.map((profile) => {
      const mine = profile.teamId === current().snap.myTeamId;
      const cells = SKILL.map((pos) => {
        const entry = profile.byPosition[pos];
        const z = entry ? entry.z || 0 : 0;
        const cell = el("td", { class: "cell" + (entry && entry.shortfall > 0 ? " hole" : ""), text: signed(z, 1) });
        cell.style.background = heatColor(z);
        cell.addEventListener("mousemove", (evt) => showTip(evt, [
          el("b", { text: profile.teamName + " · " + pos }), el("br", {}),
          el("span", { class: "num", text: n0(entry ? entry.starterStrength : 0) + " pts starting" }), el("br", {}),
          el("span", { class: "num", text: signed(z, 2) + " vs league" }),
          entry && entry.shortfall > 0 ? el("br", {}) : null,
          entry && entry.shortfall > 0 ? el("span", { text: "cannot fill a slot here" }) : null]));
        cell.addEventListener("mouseleave", hideTip);
        return cell;
      });
      const fill = el("i", { class: mine ? "me" : null });
      // Scaled across the league's own range: every roster totals within a
      // quarter of every other, so a zero-based bar discriminates nothing.
      fill.style.width = (10 + ((profile.total - floor) / ((best - floor) || 1)) * 90) + "%";
      return el("tr", {},
        el("td", { class: "team" + (mine ? " me" : ""), title: profile.teamName, text: profile.teamName }),
        cells,
        el("td", { class: "total" }, el("div", { class: "tbar" }, fill), el("span", { class: "num", text: n0(profile.total) })));
    });

    host.append(el("div", { class: "panel", style: "margin-top:16px" },
      el("h2", { text: "Every roster, by position" }),
      el("div", { class: "body" },
        el("div", { class: "heat-scroll" }, el("table", { class: "heat" },
          el("thead", {}, el("tr", {}, el("th", { class: "team-h", text: "Team" }),
            SKILL.map((pos) => el("th", { text: pos })), el("th", { text: "Best lineup" }))),
          el("tbody", {}, body))),
        el("div", { class: "scale" }, el("span", { text: "weak" }),
          el("span", { class: "ramp" }, [-1.75, -1.1, -0.45, 0, 0.45, 1.1, 1.75].map((z) => {
            const swatch = el("i", {});
            swatch.style.background = heatColor(z);
            return swatch;
          })),
          el("span", { text: "strong" }), el("span", { text: "· outlined = a slot that cannot be filled" })),
        el("p", { class: "note", text: "Sorted by best possible lineup. Each cell is that team's starters at the position, against the rest of the league." }))));
  }

  // ---------- trade finder ----------
  const BATCH = 6;

  /** A small, storable record of a suggestion — enough to render it later. */
  function compact(offer) {
    const strip = (p) => ({ playerId: p.playerId, name: p.name, position: p.position,
      nflTeam: p.nflTeam, ros: p.ros, marginalCost: p.marginalCost ?? null, wouldStart: !!p.wouldStart });
    return {
      id: offer.id, partnerTeamId: offer.partnerTeamId, partnerName: offer.partnerName,
      partnerOwner: offer.partnerOwner, myGain: offer.myGain, theirGain: offer.theirGain,
      send: offer.send.map(strip), receive: offer.receive.map(strip),
      changes: offer.lineupChanges.map((c) => ({ slot: c.slot, delta: c.delta,
        from: c.fromPlayerId, to: c.toPlayerId })),
      savedAt: new Date().toISOString(),
    };
  }

  function pool(i) {
    const entry = leagues[i];
    const key = tradeMode + "|" + (tradeMode === "shop" ? shopPlayerId : "");
    if (!entry.pool || entry.pool.key !== key) {
      const options = { limit: 60 };
      if (tradeMode === "shop" && shopPlayerId) options.shopPlayerId = shopPlayerId;
      const result = findTrades(context(i), entry.snap.myTeamId, options);
      entry.pool = { key, result };
      entry.batch = 0;
    }
    return entry.pool.result;
  }

  function renderTrades() {
    const host = $("#view-trades");
    const ctx = context(activeLeague);
    const profile = myProfile();
    host.replaceChildren();

    if (!profile) {
      host.append(el("div", { class: "blank" }, el("h3", { text: "Nothing to trade" }),
        el("p", { text: "You do not own a roster in this league." })));
      return;
    }

    const roster = ctx.rosters.get(profile.teamId);
    const tradable = roster.all.filter((p) => p.position !== "K" && p.position !== "DEF")
      .sort((a, b) => (ctx.rosFor(b) || 0) - (ctx.rosFor(a) || 0));

    const toolbar = el("div", { class: "toolbar" },
      el("div", { class: "seg" },
        el("button", { "aria-pressed": tradeMode === "weakness",
          onclick: () => { tradeMode = "weakness"; renderTrades(); } }, "Fix my weaknesses"),
        el("button", { "aria-pressed": tradeMode === "shop",
          onclick: () => { tradeMode = "shop"; renderTrades(); } }, "Shop a player")));

    if (tradeMode === "shop") {
      if (!shopPlayerId || !tradable.some((p) => p.id === shopPlayerId)) {
        shopPlayerId = tradable.length ? tradable[0].id : null;
      }
      toolbar.append(el("select", { id: "shop-player", "aria-label": "Player to shop",
        onchange: (evt) => { shopPlayerId = evt.target.value; renderTrades(); } },
        tradable.map((p) => el("option", { value: p.id, selected: p.id === shopPlayerId },
          p.fullName + " · " + p.position))));
    }

    const result = pool(activeLeague);
    const board = boardFor(currentLeagueId());
    const hidden = new Set(board.dismissed.concat(board.saved.map((s) => s.id)));

    // Order for variety without throwing anything away: the best two from each
    // manager first, then everything else by rank. One well-matched opponent
    // would otherwise fill the opening screen with variations on a single swap,
    // which reads as one option rather than ten — but capping outright would
    // also hide most of the list, and only four to six managers in a league
    // ever have a workable trade, so a hard cap leaves nothing to page through.
    const available = result.suggestions.filter((offer) => !hidden.has(offer.id));
    const perPartner = new Map();
    const headline = [];
    const rest = [];
    for (const offer of available) {
      const count = perPartner.get(offer.partnerTeamId) || 0;
      perPartner.set(offer.partnerTeamId, count + 1);
      (count < 2 ? headline : rest).push(offer);
    }
    const live = headline.concat(rest);

    const entry = current();
    const pages = Math.max(1, Math.ceil(live.length / BATCH));
    if (entry.batch >= pages) entry.batch = 0;
    const shown = live.slice(entry.batch * BATCH, entry.batch * BATCH + BATCH);

    const lastPage = entry.batch >= pages - 1;
    toolbar.append(el("button", {
      class: "ghost", disabled: live.length <= BATCH,
      title: lastPage ? "Back to the best ones" : "Show the next batch",
      onclick: () => { entry.batch += 1; renderTrades(); window.scrollTo({ top: 0 }); },
    }, el("span", { html: ICON.shuffle }),
      live.length <= BATCH ? "That is all of them" : lastPage ? "Back to the top" : "Show me different ones"));

    host.append(toolbar);

    if (!live.length) {
      const anyFound = result.suggestions.length > 0;
      host.append(el("div", { class: "blank" },
        el("h3", { text: anyFound ? "You have been through them all" : "No trade here that helps both sides" }),
        el("p", { text: anyFound
          ? "Every workable trade in this league is either saved or dismissed. Clear your dismissed list to see them again."
          : tradeMode === "shop"
            ? "Nobody in this league improves their own starting lineup by taking this player — usually because everyone is already deeper than you at his position."
            : "Every package was rejected because it made one side worse. That is the filter working, not a failure: a trade the other manager loses is a trade they decline." }),
        anyFound && board.dismissed.length
          ? el("button", { class: "ghost", onclick: () => {
              const b = boardFor(currentLeagueId());
              boards.set(currentLeagueId(), { saved: b.saved, dismissed: [] });
              persist(currentLeagueId());
              toast("Dismissed trades restored");
              render();
            } }, "Bring back " + board.dismissed.length + " dismissed")
          : null,
        !anyFound ? el("p", { class: "note", text: result.scanned.toLocaleString() + " packages examined." }) : null));
      return;
    }

    host.append(el("p", { class: "note", style: "margin:14px 0 0" },
      "Showing " + (entry.batch * BATCH + 1) + "–" + (entry.batch * BATCH + shown.length) +
      " of " + live.length + " workable trades" +
      (board.dismissed.length ? " · " + board.dismissed.length + " dismissed" : "") +
      ". Both lineups improve in every one."));

    shown.forEach((offer, i) => host.append(offerCard(offer, ctx, i === 0, false)));
  }

  // ---------- saved ----------
  function renderSaved() {
    const host = $("#view-saved");
    const ctx = context(activeLeague);
    host.replaceChildren();
    const board = boardFor(currentLeagueId());

    if (!board.saved.length) {
      host.append(el("div", { class: "blank" },
        el("h3", { text: "Nothing saved yet" }),
        el("p", {}, "Tick the ", el("b", { text: "✓" }), " on a trade in the Trade Finder and it lands here, so you can come back to the ones worth actually proposing."),
        el("p", { class: "note", text: "Saved trades are kept per league and stay put when you close the tab." })));
      return;
    }

    host.append(el("p", { class: "note", style: "margin:16px 0 0" },
      board.saved.length + " saved in " + current().snap.league.name +
      ". Gains were measured when you saved them — reopen the Trade Finder for figures against the current rosters."));

    for (const offer of board.saved) host.append(offerCard(offer, ctx, false, true));
  }

  // ---------- one suggestion ----------
  function offerCard(offer, ctx, openByDefault, isSaved) {
    const sentValue = offer.send.reduce((sum, p) => sum + (p.ros || 0), 0);
    const gotValue = offer.receive.reduce((sum, p) => sum + (p.ros || 0), 0);
    // Mutual lineup gain is necessary but not sufficient: a package where they
    // ship far more raw production than they get back is one a real manager
    // refuses on sight, whatever the optimiser says about their bench.
    const lopsided = gotValue > sentValue * 1.6 && gotValue - sentValue > 120;
    const changes = offer.lineupChanges
      ? offer.lineupChanges.map((c) => ({ slot: c.slot, delta: c.delta, from: c.fromPlayerId, to: c.toPlayerId }))
      : offer.changes || [];

    const card = el("details", { class: "offer" + (isSaved ? " is-saved" : ""), open: !!openByDefault });

    const keep = el("button", {
      class: "act keep" + (isSaved ? " on" : ""), html: ICON.check,
      "aria-label": isSaved ? "Remove from saved" : "Save this trade",
      title: isSaved ? "Remove from saved" : "Save this trade",
      onclick: (evt) => { evt.preventDefault(); evt.stopPropagation(); toggleSaved(offer, isSaved); },
    });
    const drop = el("button", {
      class: "act drop", html: ICON.x,
      "aria-label": isSaved ? "Remove from saved" : "Dismiss this trade",
      title: isSaved ? "Remove from saved" : "Dismiss this trade",
      onclick: (evt) => { evt.preventDefault(); evt.stopPropagation();
        if (isSaved) toggleSaved(offer, true); else dismiss(offer); },
    });

    card.append(el("summary", {},
      el("div", { class: "head" },
        el("div", { class: "partner" }, offer.partnerName || "Team",
          el("span", {}, offer.partnerOwner ? " · " + offer.partnerOwner : "")),
        // The collapsed row has to say what the trade IS — a list of partner
        // names and numbers cannot be scanned.
        el("div", { class: "swap" },
          el("span", { class: "out", text: offer.send.map((p) => p.name).join(" + ") }),
          el("span", { class: "arrow", text: "→" }),
          el("span", { class: "in", text: offer.receive.map((p) => p.name).join(" + ") }))),
      el("div", { class: "gains" },
        el("div", { class: "g mine" }, el("span", { class: "eyebrow", text: "you" }),
          el("b", { text: "+" + n1(offer.myGain) })),
        el("div", { class: "g" }, el("span", { class: "eyebrow", text: "them" }),
          el("b", { text: "+" + n1(offer.theirGain) }))),
      el("div", { class: "acts" }, keep, drop)));

    const leg = (label, players, showCost) => el("div", { class: "leg" },
      el("span", { class: "eyebrow", text: label }),
      players.map((p) => playerRow(
        { fullName: p.name, position: p.position, nflTeam: p.nflTeam, status: "Active" },
        p.ros,
        { starts: !!p.wouldStart,
          after: showCost && p.marginalCost !== null && p.marginalCost !== undefined
            ? "costs you " + n0(p.marginalCost) : null })));

    card.append(el("div", { class: "legs" },
      leg("You send", offer.send, true), leg("You receive", offer.receive, false)));

    const ledger = el("div", { class: "ledger" },
      el("span", { class: "eyebrow", text: "Where your gain comes from" }),
      changes.map((change) => {
        const from = change.from ? ctx.playersById[change.from] : null;
        const to = change.to ? ctx.playersById[change.to] : null;
        return el("div", { class: "row" },
          el("span", { class: "slotname", text: change.slot }),
          el("span", {}, to ? to.fullName : "nobody",
            from ? " replaces " + from.fullName : " fills an empty slot"),
          el("span", { class: "d " + (change.delta >= 0 ? "up" : "down"), text: signed(change.delta, 1) }));
      }));

    if (lopsided) {
      ledger.append(el("span", { class: "caution" },
        "Lopsided on paper. You take back " + n0(gotValue - sentValue) +
        " more points of production than you give up. Their lineup still improves — the players they send are stuck behind better ones — but expect this to read as a fleece and get declined."));
    }
    if (offer.caveats && offer.caveats.length) {
      ledger.append(el("p", { class: "note", text: "Note: " + offer.caveats.join(", ") + "." }));
    }
    card.append(ledger);
    return card;
  }

  function toggleSaved(offer, currentlySaved) {
    const leagueId = currentLeagueId();
    const board = boardFor(leagueId);
    if (currentlySaved) {
      boards.set(leagueId, { saved: board.saved.filter((s) => s.id !== offer.id), dismissed: board.dismissed });
      toast("Removed from saved");
    } else {
      boards.set(leagueId, {
        saved: board.saved.concat([compact(offer)]),
        dismissed: board.dismissed.filter((id) => id !== offer.id),
      });
      toast("Saved — see the Saved tab");
    }
    persist(leagueId);
    render();
  }

  function dismiss(offer) {
    const leagueId = currentLeagueId();
    const board = boardFor(leagueId);
    if (board.dismissed.includes(offer.id)) return;
    boards.set(leagueId, { saved: board.saved, dismissed: board.dismissed.concat([offer.id]) });
    persist(leagueId);
    toast("Dismissed");
    render();
  }

  // ---------- chrome ----------
  function renderChrome() {
    $("#who").textContent = SNAPSHOT.identity.displayName || SNAPSHOT.identity.sleeperUsername || "";

    const when = new Date(SNAPSHOT.meta.fetchedAt);
    $("#stamp").replaceChildren(
      el("div", { text: SNAPSHOT.meta.season + " · week " + SNAPSHOT.meta.currentWeek }),
      el("div", { text: "rosters " + when.toLocaleDateString(undefined, { month: "short", day: "numeric" }) }));

    $("#leagues").replaceChildren(...leagues.map((entry, i) => {
      const tab = el("button", { class: "pill", role: "tab", "aria-selected": i === activeLeague,
        onclick: () => { activeLeague = i; render(); } }, entry.snap.league.name);
      if (entry.ctx && entry.snap.myTeamId) {
        const rank = standings(entry.ctx).findIndex((p) => p.teamId === entry.snap.myTeamId) + 1;
        if (rank > 0) tab.append(el("span", { class: "rank", text: rank + "/" + entry.ctx.teams.length }));
      }
      return tab;
    }));

    const savedCount = boardFor(currentLeagueId()).saved.length;
    const savedTab = $("#tab-saved");
    savedTab.replaceChildren(document.createTextNode("Saved"));
    if (savedCount) savedTab.append(el("span", { class: "count", text: String(savedCount) }));

    for (const view of ["team", "league", "trades", "saved"]) {
      $("#tab-" + view).setAttribute("aria-selected", String(view === activeView));
      $("#view-" + view).hidden = view !== activeView;
    }

    const league = current().snap.league;
    $("#footnote").replaceChildren(
      el("p", {}, el("b", { text: "Points are rest-of-season totals" }),
        " — a weekly projection across the " + context(activeLeague).weeks +
        " weeks left, discounted for injury status. " + league.scoringType.replace("_", "-").toUpperCase() +
        " scoring, " + league.totalRosters + " teams."),
      el("p", { text: "Projections: " + SNAPSHOT.meta.projectionSource + ". Last season's production is a starting " +
        "point, not a forecast — it knows nothing about team changes or depth charts, and rookies have no line at " +
        "all, so they carry no projection rather than a zero." }),
      el("p", { text: "A trade only appears if both teams' best possible lineups improve. Value is measured against " +
        "your own roster: a player you cannot start is worth nothing to you, however good he is." }));
  }

  function render() {
    renderChrome();
    if (activeView === "team") renderTeam();
    else if (activeView === "league") renderLeague();
    else if (activeView === "trades") renderTrades();
    else renderSaved();
    renderChrome();   // league ranks need the context the view just built
  }

  for (const view of ["team", "league", "trades", "saved"]) {
    $("#tab-" + view).addEventListener("click", () => { activeView = view; render(); });
  }
  window.addEventListener("scroll", hideTip, { passive: true });

  readLocal();
  render();
  connectStore();
})();
</script>
